1, Nero-2, Bianco-2, poi di nuovo. Il punteggio appartiene alla squadra. I compagni non possono discutere la posizione durante la partita. Si applica il regolamento scelto (cinese per impostazione predefinita qui).","Orden de juego: Negro-1, Blanco-1, Negro-2, Blanco-2, y vuelta a empezar. La puntuación pertenece al equipo. Los compañeros no pueden comentar la posición durante la partida. Se aplica el reglamento elegido (chino por defecto aquí).","Ordem de jogo: Preto-1, Branco-1, Preto-2, Branco-2, e de novo. A pontuação pertence à equipa. Os parceiros não podem discutir a posição durante o jogo. Aplica-se o conjunto de regras escolhido (chinesas por omissão aqui).","Zugreihenfolge: Schwarz-1, Weiß-1, Schwarz-2, Weiß-2, dann wieder von vorn. Die Wertung gehört dem Team. Die Partner dürfen während der Partie die Stellung nicht besprechen. Es gilt das gewählte Regelwerk (hier standardmäßig chinesisch).","Lépési sorrend: Fekete-1, Fehér-1, Fekete-2, Fehér-2, majd újra. A pontszám a csapaté. A társak a játszma alatt nem beszélhetik meg az állást. A választott szabályrendszer érvényes (itt alapértelmezés szerint a kínai)."],"The partner AI does not \"communicate\"; the no-consultation rule is honour-based for human players.":["L’IA partenaire ne « communique » pas ; la règle de non-consultation repose sur l’honneur pour les joueurs humains.","L’IA compagna non «comunica»; la regola di non consultazione si basa sull’onore per i giocatori umani.","La IA compañera no «se comunica»; la regla de no consulta se basa en el honor para los jugadores humanos.","A IA parceira não «comunica»; a regra de não consulta assenta na honra para os jogadores humanos.","Die Partner-KI „kommuniziert“ nicht; die Regel des Nicht-Beratens beruht bei menschlichen Spielenden auf Ehrenwort.","A társ-MI nem „kommunikál”; az egyeztetési tilalom az emberi játékosoknál becsületen alapul."],"Phantom Go (fog of war) ⚠":["Phantom Go (brouillard de guerre) ⚠","Phantom Go (nebbia di guerra) ⚠","Phantom Go (niebla de guerra) ⚠","Phantom Go (nevoeiro de guerra) ⚠","Phantom Go (Nebel des Krieges) ⚠","Phantom Go (háborús köd) ⚠"],"You see only your own stones; a referee announces illegal moves (point occupied by the opponent) and captures.":["Vous ne voyez que vos propres pierres ; un arbitre annonce les coups illégaux (point occupé par l’adversaire) et les captures.","Vedi solo le tue pietre; un arbitro annuncia le mosse illegali (punto occupato dall’avversario) e le catture.","Solo ves tus propias piedras; un árbitro anuncia las jugadas ilegales (punto ocupado por el oponente) y las capturas.","Só vês as tuas próprias pedras; um árbitro anuncia as jogadas ilegais (ponto ocupado pelo adversário) e as capturas.","Du siehst nur deine eigenen Steine; ein Schiedsrichter sagt unzulässige Züge (vom Gegner besetzter Punkt) und Schläge an.","Csak a saját köveidet látod; egy játékvezető bejelenti a szabálytalan lépéseket (az ellenfél által elfoglalt pont) és a levételeket."],"A hidden-information variant described on Sensei's Library; derived from \"Kriegspiel\" for chess.":["Variante à information cachée décrite sur Sensei’s Library ; dérivée du « Kriegspiel » des échecs.","Variante a informazione nascosta descritta su Sensei’s Library; derivata dal «Kriegspiel» degli scacchi.","Variante de información oculta descrita en Sensei’s Library; derivada del «Kriegspiel» del ajedrez.","Variante de informação oculta descrita na Sensei’s Library; derivada do «Kriegspiel» do xadrez.","Eine Variante mit verdeckter Information, auf Sensei’s Library beschrieben; abgeleitet vom „Kriegspiel“ im Schach.","Rejtett információs változat, a Sensei’s Library-n leírva; a sakk „Kriegspiel”-jéből származik."],"Each player sees only their own stones. If you try a point occupied by an enemy stone, the move is refused, you try another, and you learn where that stone is. Captures are announced and the stones vanish. Tromp–Taylor area scoring (no marking); the board is revealed at the end.":["Chaque joueur ne voit que ses propres pierres. Si vous essayez un point occupé par une pierre ennemie, le coup est refusé, vous en essayez un autre, et vous apprenez où se trouve cette pierre. Les captures sont annoncées et les pierres disparaissent. Décompte par surface Tromp–Taylor (sans marquage) ; le plateau est révélé à la fin.","Ogni giocatore vede solo le proprie pietre. Se provi un punto occupato da una pietra nemica, la mossa viene rifiutata, ne provi un altro e scopri dove si trova quella pietra. Le catture vengono annunciate e le pietre spariscono. Conteggio per area Tromp–Taylor (senza marcatura); la tavola viene rivelata alla fine.","Cada jugador solo ve sus propias piedras. Si pruebas un punto ocupado por una piedra enemiga, la jugada se rechaza, pruebas otro y descubres dónde está esa piedra. Las capturas se anuncian y las piedras desaparecen. Recuento por área Tromp–Taylor (sin marcado); el tablero se revela al final.","Cada jogador vê apenas as suas pedras. Se tentares um ponto ocupado por uma pedra inimiga, a jogada é recusada, tentas outro e ficas a saber onde está essa pedra. As capturas são anunciadas e as pedras desaparecem. Contagem por área Tromp–Taylor (sem marcação); o tabuleiro é revelado no fim.","Jede Person sieht nur die eigenen Steine. Probierst du einen Punkt, der von einem gegnerischen Stein besetzt ist, wird der Zug abgelehnt, du probierst einen anderen und erfährst, wo dieser Stein steht. Schläge werden angesagt, und die Steine verschwinden. Tromp–Taylor-Flächenwertung (ohne Markierung); das Brett wird am Ende aufgedeckt.","Minden játékos csak a saját köveit látja. Ha olyan pontot próbálsz, amelyet ellenséges kő foglal el, a lépést elutasítják, másikat próbálsz, és megtudod, hol áll az a kő. A levételeket bejelentik, és a kövek eltűnnek. Tromp–Taylor felületszámolás (jelölés nélkül); a táblát a végén felfedik."],"⚠ Refereeing is simplified: captures reveal the positions of removed stones, and ko/suicide are announced as \"illegal\". vs AI only (hot-seat would need a privacy screen). The AI does NOT see your hidden stones: it builds its own belief from the refusals and captures it receives.":["⚠ L’arbitrage est simplifié : les captures révèlent les positions des pierres retirées, et le ko/suicide sont annoncés comme « illégal ». Contre l’IA seulement (à deux sur le même écran il faudrait un écran de confidentialité). L’IA ne voit PAS vos pierres cachées : elle construit sa propre croyance à partir des refus et des captures qu’elle reçoit.","⚠ L’arbitraggio è semplificato: le catture rivelano le posizioni delle pietre rimosse, e ko/suicidio sono annunciati come «illegale». Solo contro l’IA (in due sullo stesso schermo servirebbe una schermata di riservatezza). L’IA NON vede le tue pietre nascoste: costruisce una propria convinzione dai rifiuti e dalle catture che riceve.","⚠ El arbitraje está simplificado: las capturas revelan las posiciones de las piedras retiradas, y el ko/suicidio se anuncian como «ilegal». Solo contra la IA (a dos en la misma pantalla haría falta una pantalla de privacidad). La IA NO ve tus piedras ocultas: construye su propia creencia a partir de los rechazos y capturas que recibe.","⚠ A arbitragem está simplificada: as capturas revelam as posições das pedras removidas, e o ko/suicídio são anunciados como «ilegal». Só contra a IA (a dois no mesmo ecrã seria preciso um ecrã de privacidade). A IA NÃO vê as tuas pedras ocultas: constrói a sua própria crença a partir das recusas e capturas que recebe.","⚠ Die Schiedsrichterrolle ist vereinfacht: Schläge verraten die Positionen der entfernten Steine, und Ko/Selbstmord werden als „illegal“ angesagt. Nur gegen die KI (zu zweit am selben Bildschirm bräuchte man einen Sichtschutz-Bildschirm). Die KI sieht deine verdeckten Steine NICHT: Sie baut ihre eigene Annahme aus den Ablehnungen und Schlägen auf, die sie erhält.","⚠ A játékvezetés egyszerűsített: a levételek felfedik az eltávolított kövek helyét, a ko/öngyilkosság pedig „szabálytalan”-ként kerül bejelentésre. Csak MI ellen (egy képernyőn két játékosnak adatvédelmi képernyő kellene). Az MI NEM látja a rejtett köveidet: a kapott elutasításokból és levételekből építi fel saját feltevését."],"Go with Byo-yomi time":["Go avec temps byo-yomi","Go con tempo byo-yomi","Go con tiempo byo-yomi","Go com tempo byo-yomi","Go mit Byo-yomi-Zeit","Go byo-yomi idővel"],"Main time + byo-yomi periods of S seconds each; a working clock for both colours.":["Temps principal + périodes de byo-yomi de S secondes chacune ; une horloge fonctionnelle pour les deux couleurs.","Tempo base + periodi di byo-yomi di S secondi ciascuno; un orologio funzionante per entrambi i colori.","Tiempo principal + periodos de byo-yomi de S segundos cada uno; un reloj operativo para ambos colores.","Tempo principal + períodos de byo-yomi de S segundos cada; um relógio funcional para ambas as cores.","Hauptzeit + Byo-yomi-Perioden von je S Sekunden; eine funktionierende Uhr für beide Farben.","Főidő + egyenként S másodperces byo-yomi periódusok; működő óra mindkét színnek."],"The traditional Japanese time-control system (\"reading seconds\").":["Le système traditionnel japonais de contrôle du temps (« lecture des secondes »).","Il sistema tradizionale giapponese di controllo del tempo («lettura dei secondi»).","El sistema tradicional japonés de control del tiempo («lectura de segundos»).","O sistema tradicional japonês de controlo do tempo («leitura de segundos»).","Das traditionelle japanische Zeitkontrollsystem („Sekunden lesen“).","A hagyományos japán időkezelési rendszer („másodpercek olvasása”)."],"Each player has main time. When it runs out, periods begin: moving within S seconds refills the period; exceeding S loses a period. With no periods left the player loses on time. The clock is stopped during dead-stone marking. Against the AI its clock runs while it thinks (AI thinking is capped below the current period).":["Chaque joueur dispose d’un temps principal. Quand il est épuisé, les périodes commencent : jouer en moins de S secondes recharge la période ; dépasser S fait perdre une période. Sans période restante, le joueur perd au temps. L’horloge est arrêtée pendant le marquage des pierres mortes. Contre l’IA, son horloge tourne pendant qu’elle réfléchit (la réflexion de l’IA est plafonnée sous la période en cours).","Ogni giocatore ha un tempo base. Quando finisce, iniziano i periodi: muovere entro S secondi ricarica il periodo; superare S fa perdere un periodo. Senza periodi rimasti il giocatore perde a tempo. L’orologio è fermo durante la marcatura delle pietre morte. Contro l’IA il suo orologio scorre mentre pensa (il pensiero dell’IA è limitato al di sotto del periodo corrente).","Cada jugador tiene tiempo principal. Cuando se agota, empiezan los periodos: jugar en menos de S segundos rellena el periodo; superar S pierde un periodo. Sin periodos restantes, el jugador pierde por tiempo. El reloj se detiene durante el marcado de piedras muertas. Contra la IA, su reloj corre mientras piensa (el pensamiento de la IA está limitado por debajo del periodo actual).","Cada jogador tem tempo principal. Quando acaba, começam os períodos: jogar em menos de S segundos recarrega o período; exceder S perde um período. Sem períodos restantes, o jogador perde por tempo. O relógio pára durante a marcação das pedras mortas. Contra a IA, o seu relógio corre enquanto pensa (o pensamento da IA é limitado abaixo do período atual).","Jede Person hat Hauptzeit. Ist sie aufgebraucht, beginnen die Perioden: Ein Zug innerhalb von S Sekunden füllt die Periode wieder auf; wer S überschreitet, verliert eine Periode. Ohne verbleibende Perioden verliert man auf Zeit. Die Uhr steht still, während tote Steine markiert werden. Gegen die KI läuft deren Uhr, während sie denkt (das Denken der KI ist unter der aktuellen Periode begrenzt).","Mindegyik játékosnak főideje van. Ha elfogy, a periódusok kezdődnek: S másodpercen belüli lépés újratölti a periódust; S túllépése periódust veszít. Ha nem marad periódus, a játékos időre veszít. Az óra a halott kövek jelölése alatt áll. Az MI ellen az ő órája gondolkodás közben fut (az MI gondolkodása az aktuális periódus alatt korlátozott)."],"The clock uses the system clock (Date.now); closing the tab or suspending the device cannot be told from thinking.":["L’horloge utilise l’horloge système (Date.now) ; fermer l’onglet ou mettre l’appareil en veille ne se distingue pas de la réflexion.","L’orologio usa l’orologio di sistema (Date.now); chiudere la scheda o sospendere il dispositivo non si distingue dal pensare.","El reloj usa el reloj del sistema (Date.now); cerrar la pestaña o suspender el dispositivo no se distingue de pensar.","O relógio usa o relógio do sistema (Date.now); fechar o separador ou suspender o dispositivo não se distingue de pensar.","Die Uhr nutzt die Systemuhr (Date.now); das Schließen des Tabs oder das Ruhezustands-Versetzen des Geräts lässt sich nicht vom Nachdenken unterscheiden.","Az óra a rendszerórát használja (Date.now); a fül bezárása vagy az eszköz felfüggesztése nem különböztethető meg a gondolkodástól."],"Pair Go":["Pair Go","Pair Go","Pair Go","Pair Go","Pair Go","Pair Go"],"Rengo with mixed pairs, played on 19×19 in international events.":["Rengo avec des paires mixtes, joué en 19×19 lors d’événements internationaux.","Rengo con coppie miste, giocato in 19×19 negli eventi internazionali.","Rengo con parejas mixtas, que se juega en 19×19 en eventos internacionales.","Rengo com pares mistos, jogado em 19×19 em eventos internacionais.","Rengo mit gemischten Paaren, gespielt auf 19×19 bei internationalen Veranstaltungen.","Rengo vegyes párokkal, nemzetközi rendezvényeken 19×19-en játsszák."],"Introduced in the 1990s in Japan; international championships exist.":["Introduit dans les années 1990 au Japon ; il existe des championnats internationaux.","Introdotto negli anni Novanta in Giappone; esistono campionati internazionali.","Introducido en los años noventa en Japón; existen campeonatos internacionales.","Introduzido nos anos 1990 no Japão; existem campeonatos internacionais.","In den 1990er-Jahren in Japan eingeführt; es gibt internationale Meisterschaften.","Az 1990-es években vezették be Japánban; nemzetközi bajnokságok léteznek."],"Teams of one man and one woman, alternating Black-Man / White-Woman / etc., with special clock and communication rules.":["Équipes d’un homme et d’une femme, en alternant Noir-Homme / Blanc-Femme / etc., avec des règles spéciales d’horloge et de communication.","Squadre di un uomo e una donna, alternando Nero-Uomo / Bianco-Donna / ecc., con regole speciali di orologio e comunicazione.","Equipos de un hombre y una mujer, alternando Negro-Hombre / Blanco-Mujer / etc., con reglas especiales de reloj y comunicación.","Equipas de um homem e uma mulher, alternando Preto-Homem / Branco-Mulher / etc., com regras especiais de relógio e comunicação.","Teams aus einem Mann und einer Frau, abwechselnd Schwarz-Mann / Weiß-Frau / usw., mit besonderen Uhr- und Kommunikationsregeln.","Egy férfiból és egy nőből álló csapatok, váltakozva Fekete-férfi / Fehér-nő / stb., különleges óra- és kommunikációs szabályokkal."],"Atlas only: for the basic mechanics use Rengo.":["Atlas seulement : pour la mécanique de base, utilisez le Rengo.","Solo atlante: per la meccanica di base usa il Rengo.","Solo atlas: para la mecánica básica usa el Rengo.","Só atlas: para a mecânica básica usa o Rengo.","Nur Atlas: Für die Grundmechanik nutze Rengo.","Csak atlasz: az alapmechanikához használd a Rengót."],"Toroidal Go":["Go toroïdal","Go toroidale","Go toroidal","Go toroidal","Toroidales Go","Toroidális Go"],"Board edges wrap around: no corners or sides, hence no edge lines.":["Les bords du plateau se rejoignent : ni coins ni côtés, donc pas de lignes de bord.","I bordi della tavola si congiungono: niente angoli né lati, quindi niente linee di bordo.","Los bordes del tablero se unen: sin esquinas ni lados, por tanto sin líneas de borde.","Os bordos do tabuleiro ligam-se: sem cantos nem lados, logo sem linhas de bordo.","Die Brettränder werden verbunden: keine Ecken oder Seiten, also keine Randlinien.","A tábla szélei összeérnek: nincsenek sarkok és oldalak, így szélvonalak sem."],"A mathematical/theoretical idea used for strategy study and research.":["Une idée mathématique/théorique utilisée pour l’étude de la stratégie et la recherche.","Un’idea matematica/teorica usata per lo studio della strategia e la ricerca.","Una idea matemática/teórica usada para el estudio de la estrategia y la investigación.","Uma ideia matemática/teórica usada no estudo da estratégia e na investigação.","Eine mathematische/theoretische Idee, die für Strategiestudien und Forschung genutzt wird.","Matematikai/elméleti ötlet, amelyet a stratégia tanulmányozásához és kutatáshoz használnak."],"Same rules, but neighbourhoods wrap. With no edge there are no edge eyes, and life-and-death theory changes.":["Mêmes règles, mais les voisinages se referment sur eux-mêmes. Sans bord, il n’y a pas d’yeux de bord, et la théorie de la vie et de la mort change.","Stesse regole, ma i vicinati si chiudono ad anello. Senza bordo non ci sono occhi di bordo, e la teoria di vita e morte cambia.","Mismas reglas, pero las vecindades se cierran en anillo. Sin borde no hay ojos de borde, y la teoría de vida y muerte cambia.","Mesmas regras, mas as vizinhanças fecham-se em anel. Sem bordo não há olhos de bordo, e a teoria da vida e da morte muda.","Dieselben Regeln, aber die Nachbarschaften schließen sich ringförmig. Ohne Rand gibt es keine Randaugen, und die Lebens-und-Tod-Theorie ändert sich.","Ugyanazok a szabályok, de a szomszédságok körbezáródnak. Perem nélkül nincsenek peremszemek, és az élet-halál elmélet megváltozik."],"Atlas only: the engine here uses flat boards.":["Atlas seulement : le moteur d’ici utilise des plateaux plans.","Solo atlante: il motore qui usa tavole piane.","Solo atlas: el motor de aquí usa tableros planos.","Só atlas: o motor aqui usa tabuleiros planos.","Nur Atlas: Die Engine hier verwendet ebene Bretter.","Csak atlasz: az itteni motor sík táblákat használ."],"Hexagonal-grid Go":["Go sur grille hexagonale","Go su griglia esagonale","Go en cuadrícula hexagonal","Go em grelha hexagonal","Go auf hexagonalem Gitter","Go hatszögrácson"],"Each point has 6 neighbours; shapes and liberty counts differ.":["Chaque point a 6 voisins ; les formes et le nombre de libertés diffèrent.","Ogni punto ha 6 vicini; forme e numero di libertà differiscono.","Cada punto tiene 6 vecinos; las formas y el número de libertades difieren.","Cada ponto tem 6 vizinhos; as formas e o número de liberdades diferem.","Jeder Punkt hat 6 Nachbarn; Formen und Freiheitszahlen unterscheiden sich.","Minden pontnak 6 szomszédja van; az alakzatok és a szabadságok száma eltér."],"An amateur-proposed variant with no standardised form.":["Une variante proposée par des amateurs, sans forme normalisée.","Una variante proposta da dilettanti, senza forma standardizzata.","Una variante propuesta por aficionados, sin forma estandarizada.","Uma variante proposta por amadores, sem forma padronizada.","Eine von Amateuren vorgeschlagene Variante ohne standardisierte Form.","Amatőrök által javasolt változat, szabványosított forma nélkül."],"Same principles (liberties, capture, ko) on a hexagonal grid (e.g. a Hex board).":["Mêmes principes (libertés, capture, ko) sur une grille hexagonale (p. ex. un plateau de Hex).","Stessi principi (libertà, cattura, ko) su una griglia esagonale (ad es. una tavola di Hex).","Mismos principios (libertades, captura, ko) en una cuadrícula hexagonal (p. ej. un tablero de Hex).","Mesmos princípios (liberdades, captura, ko) numa grelha hexagonal (p. ex. um tabuleiro de Hex).","Dieselben Prinzipien (Freiheiten, Schlagen, Ko) auf einem hexagonalen Gitter (z. B. einem Hex-Brett).","Ugyanazok az elvek (szabadságok, levétel, ko) hatszögrácson (pl. egy Hex-táblán)."],"Atlas only: there is no single rulebook.":["Atlas seulement : il n’existe pas de règlement unique.","Solo atlante: non esiste un regolamento unico.","Solo atlas: no hay un reglamento único.","Só atlas: não existe um regulamento único.","Nur Atlas: Es gibt kein einheitliches Regelwerk.","Csak atlasz: nincs egységes szabálykönyv."],"Three-player Go":["Go à trois joueurs","Go a tre giocatori","Go para tres jugadores","Go para três jogadores","Go für drei Spielende","Go három játékosnak"],"Three colours on one board; alliances and kingmaking appear, so balance is problematic.":["Trois couleurs sur un même plateau ; des alliances et des « faiseurs de roi » apparaissent, ce qui rend l’équilibre problématique.","Tre colori su una sola tavola; compaiono alleanze e «king-making», quindi l’equilibrio è problematico.","Tres colores en un mismo tablero; aparecen alianzas y «hacedores de reyes», por lo que el equilibrio es problemático.","Três cores num só tabuleiro; surgem alianças e «fazedores de reis», pelo que o equilíbrio é problemático.","Drei Farben auf einem Brett; es entstehen Bündnisse und „Königsmacher“, daher ist das Gleichgewicht problematisch.","Három szín egy táblán; szövetségek és „királycsinálók” jelennek meg, ezért az egyensúly problematikus."],"Amateur experiments; no federation or official rules.":["Expériences d’amateurs ; ni fédération ni règles officielles.","Esperimenti amatoriali; nessuna federazione né regole ufficiali.","Experimentos de aficionados; sin federación ni reglas oficiales.","Experiências de amadores; sem federação nem regras oficiais.","Amateurexperimente; kein Verband und keine offiziellen Regeln.","Amatőr kísérletek; nincs szövetség, sem hivatalos szabály."],"Various versions: triangular or hexagonal boards, territory scoring, players eliminated at zero liberties.":["Versions diverses : plateaux triangulaires ou hexagonaux, décompte par territoire, joueurs éliminés à zéro liberté.","Versioni varie: tavole triangolari o esagonali, conteggio per territorio, giocatori eliminati a zero libertà.","Versiones diversas: tableros triangulares o hexagonales, recuento por territorio, jugadores eliminados al quedarse sin libertades.","Versões várias: tabuleiros triangulares ou hexagonais, contagem por território, jogadores eliminados a zero liberdades.","Verschiedene Versionen: dreieckige oder hexagonale Bretter, Gebietswertung, Spielende scheiden bei null Freiheiten aus.","Különféle változatok: háromszög vagy hatszög alakú táblák, területszámolás, a nulla szabadságra jutó játékosok kiesnek."],"Atlas only.":["Atlas seulement.","Solo atlante.","Solo atlas.","Só atlas.","Nur Atlas.","Csak atlasz."],"Ing rules (SST)":["Règles Ing (SST)","Regole Ing (SST)","Reglas Ing (SST)","Regras Ing (SST)","Ing-Regeln (SST)","Ing szabályok (SST)"],"Ing Chang-ki's ruleset with area-like counting and fixed \"tax\" stones (Ing stones).":["Le règlement d’Ing Chang-ki avec un décompte proche de la surface et des pierres de « taxe » fixes (pierres Ing).","Il regolamento di Ing Chang-ki con conteggio simile all’area e pietre di «tassa» fisse (pietre Ing).","El reglamento de Ing Chang-ki con recuento parecido al de área y piedras de «impuesto» fijas (piedras Ing).","O regulamento de Ing Chang-ki com contagem semelhante à de área e pedras de «imposto» fixas (pedras Ing).","Das Regelwerk von Ing Chang-ki mit flächenähnlicher Zählung und festen „Steuer“-Steinen (Ing-Steine).","Ing Chang-ki szabályrendszere felületszerű számolással és rögzített „adó” kövekkel (Ing-kövek)."],"Devised in Taiwan; used at the Ing Cup and other events.":["Conçu à Taïwan ; utilisé à la Coupe Ing et lors d’autres événements.","Ideato a Taiwan; usato alla Ing Cup e in altri eventi.","Ideado en Taiwán; usado en la Copa Ing y otros eventos.","Concebido em Taiwan; usado na Taça Ing e noutros eventos.","In Taiwan entwickelt; beim Ing-Cup und bei anderen Veranstaltungen verwendet.","Tajvanon dolgozták ki; az Ing Kupán és más rendezvényeken használják."],"Zone counting with taxes on seki, and ko with specific rules; komi 8 points.":["Décompte par zone avec taxes sur le seki, et ko avec des règles spécifiques ; komi de 8 points.","Conteggio a zona con tasse sul seki, e ko con regole specifiche; komi di 8 punti.","Recuento por zona con impuestos sobre el seki, y ko con reglas específicas; komi de 8 puntos.","Contagem por zona com impostos sobre o seki, e ko com regras específicas; komi de 8 pontos.","Zonenzählung mit Steuern auf Seki und Ko mit besonderen Regeln; Komi 8 Punkte.","Zónaszámolás a sekire kivetett adókkal, és sajátos szabályokkal rendelkező ko; komi 8 pont."],"Atlas only; the full rulebook details are not reproduced here.":["Atlas seulement ; les détails complets du règlement ne sont pas reproduits ici.","Solo atlante; i dettagli completi del regolamento non sono riprodotti qui.","Solo atlas; los detalles completos del reglamento no se reproducen aquí.","Só atlas; os pormenores completos do regulamento não são reproduzidos aqui.","Nur Atlas; die vollständigen Regelwerksdetails sind hier nicht wiedergegeben.","Csak atlasz; a teljes szabálykönyv részleteit itt nem közöljük."],"New Zealand rules":["Règles néo-zélandaises","Regole neozelandesi","Reglas neozelandesas","Regras neozelandesas","Neuseeländische Regeln","Új-zélandi szabályok"],"An area-scoring ruleset that permits suicide and forbids position repetition.":["Un règlement à décompte par surface qui autorise le suicide et interdit la répétition de position.","Un regolamento a conteggio per area che permette il suicidio e vieta la ripetizione di posizione.","Un reglamento de recuento por área que permite el suicidio y prohíbe la repetición de posición.","Um regulamento de contagem por área que permite o suicídio e proíbe a repetição de posição.","Ein Regelwerk mit Flächenwertung, das Selbstmord erlaubt und Stellungswiederholung verbietet.","Felületszámolású szabályrendszer, amely megengedi az öngyilkosságot, és tiltja az állások ismétlését."],"Devised by New Zealand Go players as rules that are \"as simple as possible to explain\".":["Conçues par des joueurs de Go néo-zélandais comme des règles « aussi simples que possible à expliquer ».","Ideate da giocatori di Go neozelandesi come regole «il più semplici possibile da spiegare».","Ideadas por jugadores de Go neozelandeses como reglas «lo más sencillas posible de explicar».","Concebidas por jogadores de Go neozelandeses como regras «o mais simples possível de explicar».","Von neuseeländischen Go-Spielenden als Regeln entwickelt, die „so einfach wie möglich zu erklären“ sind.","Új-zélandi Go-játékosok dolgozták ki „a lehető legegyszerűbben elmagyarázható” szabályokként."],"Area scoring, komi 7, suicide permitted, repetition forbidden. In this engine they can be approximated with the \"custom\" set (area + suicide + superko).":["Décompte par surface, komi 7, suicide autorisé, répétition interdite. Dans ce moteur on peut les approcher avec le jeu « personnalisé » (surface + suicide + superko).","Conteggio per area, komi 7, suicidio permesso, ripetizione vietata. In questo motore si possono approssimare con il set «personalizzato» (area + suicidio + superko).","Recuento por área, komi 7, suicidio permitido, repetición prohibida. En este motor se pueden aproximar con el conjunto «personalizado» (área + suicidio + superko).","Contagem por área, komi 7, suicídio permitido, repetição proibida. Neste motor podem aproximar-se com o conjunto «personalizado» (área + suicídio + superko).","Flächenwertung, Komi 7, Selbstmord erlaubt, Wiederholung verboten. In dieser Engine lassen sie sich mit dem Satz „benutzerdefiniert“ annähern (Fläche + Selbstmord + Superko).","Felületszámolás, komi 7, az öngyilkosság megengedett, az ismétlés tilos. Ebben a motorban az „egyéni” készlettel közelíthetők (felület + öngyilkosság + superko)."],"Atlas only: exact details (positional vs situational superko) must be checked in the source.":["Atlas seulement : les détails exacts (superko positionnel ou situationnel) doivent être vérifiés dans la source.","Solo atlante: i dettagli esatti (superko posizionale o situazionale) vanno verificati nella fonte.","Solo atlas: los detalles exactos (superko posicional o situacional) deben comprobarse en la fuente.","Só atlas: os pormenores exatos (superko posicional ou situacional) têm de ser verificados na fonte.","Nur Atlas: Die genauen Einzelheiten (positioneller oder situativer Superko) müssen in der Quelle geprüft werden.","Csak atlasz: a pontos részleteket (pozicionális vagy szituációs superko) a forrásban kell ellenőrizni."],"Level 1 · Heuristic, no tree":["Niveau 1 · Heuristique, sans arbre","Livello 1 · Euristico, senza albero","Nivel 1 · Heurístico, sin árbol","Nível 1 · Heurístico, sem árvore","Stufe 1 · Heuristik, ohne Baum","1. szint · Heurisztikus, fa nélkül"],"Level 2 · Short MCTS":["Niveau 2 · MCTS court","Livello 2 · MCTS breve","Nivel 2 · MCTS corto","Nível 2 · MCTS curto","Stufe 2 · kurzes MCTS","2. szint · Rövid MCTS"],"Level 3 · Medium MCTS":["Niveau 3 · MCTS moyen","Livello 3 · MCTS medio","Nivel 3 · MCTS medio","Nível 3 · MCTS médio","Stufe 3 · mittleres MCTS","3. szint · Közepes MCTS"],"Level 4 · Long MCTS":["Niveau 4 · MCTS long","Livello 4 · MCTS lungo","Nivel 4 · MCTS largo","Nível 4 · MCTS longo","Stufe 4 · langes MCTS","4. szint · Hosszú MCTS"],"Level 5 · Very long MCTS":["Niveau 5 · MCTS très long","Livello 5 · MCTS molto lungo","Nivel 5 · MCTS muy largo","Nível 5 · MCTS muito longo","Stufe 5 · sehr langes MCTS","5. szint · Nagyon hosszú MCTS"],"1. Board and stones":["1. Plateau et pierres","1. Tavola e pietre","1. Tablero y piedras","1. Tabuleiro e pedras","1. Brett und Steine","1. A tábla és a kövek"],"Stones go on intersections, not inside squares. Black starts, then you alternate. A placed stone never moves. Place a few stones alternately, then move on.":["Les pierres se posent sur les intersections, pas dans les cases. Noir commence, puis on alterne. Une pierre posée ne bouge jamais. Posez quelques pierres en alternance, puis passez à la suite.","Le pietre si posano sulle intersezioni, non dentro i quadrati. Nero inizia, poi ci si alterna. Una pietra posata non si sposta mai. Posa alcune pietre alternandoti, poi vai avanti.","Las piedras se colocan en las intersecciones, no dentro de los cuadrados. Negro empieza y luego se alterna. Una piedra colocada nunca se mueve. Coloca algunas piedras alternando y luego sigue adelante.","As pedras colocam-se nas interseções, não dentro dos quadrados. O Preto começa e depois alterna-se. Uma pedra colocada nunca se move. Coloca algumas pedras alternadamente e depois avança.","Steine werden auf die Schnittpunkte gesetzt, nicht in die Felder. Schwarz beginnt, dann wechselt man sich ab. Ein gesetzter Stein bewegt sich nie. Setze abwechselnd ein paar Steine und mach dann weiter.","A köveket a metszéspontokra tesszük, nem a mezőkbe. A Fekete kezd, aztán váltakozunk. A lerakott kő soha nem mozdul. Tegyél le néhány követ felváltva, aztán lépj tovább."],"2. Liberties":["2. Libertés","2. Libertà","2. Libertades","2. Liberdades","2. Freiheiten","2. Szabadságok"],"A liberty is an adjacent free point (up, down, left, right; not diagonal). The white stone in the centre has 4 liberties. Play Black around it until it has just one liberty (atari). Click a stone to see its liberties.":["Une liberté est un point libre adjacent (haut, bas, gauche, droite ; pas en diagonale). La pierre blanche au centre a 4 libertés. Jouez Noir autour d’elle jusqu’à ce qu’elle n’ait plus qu’une seule liberté (atari). Cliquez sur une pierre pour voir ses libertés.","Una libertà è un punto libero adiacente (su, giù, sinistra, destra; non in diagonale). La pietra bianca al centro ha 4 libertà. Gioca Nero attorno a essa finché le rimane una sola libertà (atari). Clicca su una pietra per vederne le libertà.","Una libertad es un punto libre adyacente (arriba, abajo, izquierda, derecha; no en diagonal). La piedra blanca del centro tiene 4 libertades. Juega con Negro a su alrededor hasta que le quede una sola libertad (atari). Haz clic en una piedra para ver sus libertades.","Uma liberdade é um ponto livre adjacente (cima, baixo, esquerda, direita; não na diagonal). A pedra branca ao centro tem 4 liberdades. Joga com o Preto à volta dela até lhe restar uma só liberdade (atari). Clica numa pedra para ver as suas liberdades.","Eine Freiheit ist ein angrenzender freier Punkt (oben, unten, links, rechts; nicht diagonal). Der weiße Stein in der Mitte hat 4 Freiheiten. Spiele mit Schwarz um ihn herum, bis er nur noch eine Freiheit hat (Atari). Klicke auf einen Stein, um seine Freiheiten zu sehen.","A szabadság egy szomszédos szabad pont (fent, lent, balra, jobbra; átlósan nem). A középső fehér kőnek 4 szabadsága van. Játssz Feketével körülötte, amíg egyetlen szabadsága marad (atari). Kattints egy kőre, hogy lásd a szabadságait."],"3. Capture":["3. Capture","3. Cattura","3. Captura","3. Captura","3. Schlagen","3. Levétel"],"When a chain has no liberties left it is captured and removed. The white stone has one liberty. Capture it!":["Quand une chaîne n’a plus de libertés, elle est capturée et retirée. La pierre blanche n’a qu’une seule liberté. Capturez-la !","Quando una catena non ha più libertà viene catturata e rimossa. La pietra bianca ha una sola libertà. Catturala!","Cuando una cadena se queda sin libertades, es capturada y retirada. La piedra blanca tiene una sola libertad. ¡Captúrala!","Quando uma cadeia fica sem liberdades, é capturada e retirada. A pedra branca tem uma só liberdade. Captura-a!","Hat eine Kette keine Freiheiten mehr, wird sie geschlagen und entfernt. Der weiße Stein hat eine Freiheit. Schlage ihn!","Ha egy láncnak nem marad szabadsága, levétetik és eltávolítják. A fehér kőnek egyetlen szabadsága van. Vedd le!"],"4. Ko":["4. Ko","4. Ko","4. Ko","4. Ko","4. Ko","4. Ko"],"You may not recreate the previous position. Black captures in the ko (marked point). Then White tries to retake immediately: it will be refused. White must first play elsewhere (a \"threat\").":["Vous n’avez pas le droit de recréer la position précédente. Noir capture dans le ko (point marqué). Puis Blanc essaie de reprendre aussitôt : il sera refusé. Blanc doit d’abord jouer ailleurs (une « menace »).","Non puoi ricreare la posizione precedente. Nero cattura nel ko (punto segnato). Poi Bianco prova a riprendere subito: verrà rifiutato. Bianco deve prima giocare altrove (una «minaccia»).","No puedes recrear la posición anterior. Negro captura en el ko (punto marcado). Luego Blanco intenta recapturar de inmediato: se le rechazará. Blanco debe jugar antes en otro sitio (una «amenaza»).","Não podes recriar a posição anterior. O Preto captura no ko (ponto marcado). Depois o Branco tenta recapturar de imediato: será recusado. O Branco tem de jogar primeiro noutro lado (uma «ameaça»).","Du darfst die vorherige Stellung nicht wiederherstellen. Schwarz schlägt im Ko (markierter Punkt). Dann versucht Weiß sofort zurückzuschlagen: Es wird abgelehnt. Weiß muss zuerst woanders spielen (eine „Drohung“).","Nem hozhatod létre újra az előző állást. A Fekete levesz a kóban (jelölt pont). Aztán a Fehér azonnal vissza akar ütni: elutasítják. A Fehérnek előbb máshol kell lépnie (egy „fenyegetés”)."],"Black: capture at the marked point.":["Noir : capturez au point marqué.","Nero: cattura nel punto segnato.","Negro: captura en el punto marcado.","Preto: captura no ponto marcado.","Schwarz: Schlage am markierten Punkt.","Fekete: vegyél le a jelölt pontnál."],"White: try to retake at the marked point.":["Blanc : essayez de reprendre au point marqué.","Bianco: prova a riprendere nel punto segnato.","Blanco: intenta recapturar en el punto marcado.","Branco: tenta recapturar no ponto marcado.","Weiß: Versuche, am markierten Punkt zurückzuschlagen.","Fehér: próbálj visszaütni a jelölt pontnál."],"White: play a threat anywhere else.":["Blanc : jouez une menace n’importe où ailleurs.","Bianco: gioca una minaccia in qualsiasi altro punto.","Blanco: juega una amenaza en cualquier otro lugar.","Branco: joga uma ameaça em qualquer outro lado.","Weiß: Spiele irgendwo anders eine Drohung.","Fehér: tegyél fenyegetést bárhol máshol."],"Black: answer anywhere (elsewhere).":["Noir : répondez n’importe où (ailleurs).","Nero: rispondi ovunque (altrove).","Negro: responde en cualquier sitio (en otro lugar).","Preto: responde em qualquer lado (noutro sítio).","Schwarz: Antworte irgendwo (anderswo).","Fekete: válaszolj bárhol (máshol)."],"White: now you may retake the ko.":["Blanc : vous pouvez maintenant reprendre le ko.","Bianco: ora puoi riprendere il ko.","Blanco: ahora puedes recapturar el ko.","Branco: agora podes recapturar o ko.","Weiß: Jetzt darfst du das Ko zurückschlagen.","Fehér: most visszaüthetsz a kóban."],"5. Two eyes = life":["5. Deux yeux = la vie","5. Due occhi = vita","5. Dos ojos = vida","5. Dois olhos = vida","5. Zwei Augen = Leben","5. Két szem = élet"],"A group with two separate eyes cannot be captured: the opponent cannot fill both (that would be suicide). The white group has a three-in-a-row eye space. Play the vital point (the middle) to make two eyes.":["Un groupe avec deux yeux distincts ne peut pas être capturé : l’adversaire ne peut pas remplir les deux (ce serait un suicide). Le groupe blanc a un espace d’œil de trois points alignés. Jouez le point vital (le milieu) pour faire deux yeux.","Un gruppo con due occhi separati non può essere catturato: l’avversario non può riempirli entrambi (sarebbe suicidio). Il gruppo bianco ha uno spazio d’occhio di tre punti in fila. Gioca il punto vitale (quello centrale) per fare due occhi.","Un grupo con dos ojos separados no puede ser capturado: el oponente no puede rellenar ambos (sería suicidio). El grupo blanco tiene un espacio de ojo de tres puntos en línea. Juega el punto vital (el del medio) para hacer dos ojos.","Um grupo com dois olhos separados não pode ser capturado: o adversário não consegue preencher ambos (seria suicídio). O grupo branco tem um espaço de olho de três pontos em linha. Joga o ponto vital (o do meio) para fazer dois olhos.","Eine Gruppe mit zwei getrennten Augen kann nicht geschlagen werden: Der Gegner kann nicht beide füllen (das wäre Selbstmord). Die weiße Gruppe hat einen Augenraum aus drei Punkten in einer Reihe. Spiele den vitalen Punkt (die Mitte), um zwei Augen zu machen.","Az a csoport, amelynek két különálló szeme van, nem vehető le: az ellenfél nem töltheti ki mindkettőt (az öngyilkosság lenne). A fehér csoportnak hárompontos, egy vonalban álló szemtere van. Játszd a létfontosságú pontot (a középsőt), hogy két szemet csinálj."],"6. Seki (mutual life)":["6. Seki (vie mutuelle)","6. Seki (vita reciproca)","6. Seki (vida mutua)","6. Seki (vida mútua)","6. Seki (gegenseitiges Leben)","6. Seki (kölcsönös élet)"],"In seki two groups touch and share liberties; whoever plays in them puts themselves in atari and is captured. Result: both stay on the board and the shared points are worth nothing. Try it: Black plays in the corner (marked point) and see what follows.":["Au seki, deux groupes se touchent et partagent des libertés ; celui qui y joue se met en atari et est capturé. Résultat : les deux restent sur le plateau et les points communs ne valent rien. Essayez : Noir joue dans le coin (point marqué) et voyez la suite.","Nel seki due gruppi si toccano e condividono libertà; chi gioca al loro interno si mette in atari e viene catturato. Risultato: entrambi restano sulla tavola e i punti comuni non valgono nulla. Prova: Nero gioca nell’angolo (punto segnato) e guarda cosa succede.","En el seki dos grupos se tocan y comparten libertades; quien juega en ellas se pone en atari y es capturado. Resultado: ambos permanecen en el tablero y los puntos comunes no valen nada. Pruébalo: Negro juega en la esquina (punto marcado) y observa lo que sigue.","No seki dois grupos tocam-se e partilham liberdades; quem joga nelas põe-se em atari e é capturado. Resultado: ambos ficam no tabuleiro e os pontos comuns não valem nada. Experimenta: o Preto joga no canto (ponto marcado) e vê o que se segue.","Im Seki berühren sich zwei Gruppen und teilen Freiheiten; wer dort spielt, setzt sich selbst in Atari und wird geschlagen. Ergebnis: Beide bleiben auf dem Brett, und die gemeinsamen Punkte sind nichts wert. Probiere es: Schwarz spielt in der Ecke (markierter Punkt) und sieh, was folgt.","A szekiben két csoport érintkezik és osztozik a szabadságokon; aki ezekbe lép, ataribe teszi magát, és leveszik. Eredmény: mindkettő a táblán marad, a közös pontok pedig semmit sem érnek. Próbáld ki: a Fekete a sarokba lép (jelölt pont), és nézd meg, mi következik."],"Black: play in the corner.":["Noir : jouez dans le coin.","Nero: gioca nell’angolo.","Negro: juega en la esquina.","Preto: joga no canto.","Schwarz: Spiele in der Ecke.","Fekete: lépj a sarokba."],"White captured the whole black group. That is why neither player enters: both groups stay in seki.":["Blanc a capturé tout le groupe noir. C’est pourquoi aucun joueur n’y entre : les deux groupes restent en seki.","Bianco ha catturato tutto il gruppo nero. Per questo nessuno dei due giocatori entra: entrambi i gruppi restano in seki.","Blanco ha capturado todo el grupo negro. Por eso ningún jugador entra: ambos grupos quedan en seki.","O Branco capturou todo o grupo preto. É por isso que nenhum jogador entra: ambos os grupos ficam em seki.","Weiß hat die ganze schwarze Gruppe geschlagen. Darum betritt keine Seite das Gebiet: Beide Gruppen bleiben im Seki.","A Fehér levette a teljes fekete csoportot. Ezért egyik játékos sem lép be: mindkét csoport szekiben marad."],"Go (Baduk, Weiqi, Igo) in a single offline HTML file. Boards from 5×5 to 19×19, Japanese, Chinese, AGA and Tromp–Taylor rules, handicap 2–9, an MCTS AI opponent, two players, 2-vs-2 Rengo, Atari-Go / Ponnuki-Go, NoGo, Phantom Go, a byo-yomi clock, interactive lessons, solver-verified tsume-go problems and SGF import/export. The atlas also lists variants that are NOT playable here (marked “atlas only”).":["Go (Baduk, Weiqi, Igo) dans un seul fichier HTML, hors ligne. Plateaux de 5×5 à 19×19, règles japonaises, chinoises, AGA et Tromp–Taylor, handicap 2–9, un adversaire IA MCTS, deux joueurs, Rengo 2 contre 2, Atari-Go / Ponnuki-Go, NoGo, Phantom Go, une horloge byo-yomi, leçons interactives, problèmes de tsume-go vérifiés par un solveur et import/export SGF. L’atlas répertorie aussi des variantes qui NE sont PAS jouables ici (marquées « atlas seulement »).","Go (Baduk, Weiqi, Igo) in un unico file HTML, offline. Tavole da 5×5 a 19×19, regole giapponesi, cinesi, AGA e Tromp–Taylor, handicap 2–9, un avversario IA MCTS, due giocatori, Rengo 2 contro 2, Atari-Go / Ponnuki-Go, NoGo, Phantom Go, un orologio byo-yomi, lezioni interattive, problemi di tsume-go verificati da un solver e importazione/esportazione SGF. L’atlante elenca anche varianti che NON sono giocabili qui (segnate «solo atlante»).","Go (Baduk, Weiqi, Igo) en un único archivo HTML, sin conexión. Tableros de 5×5 a 19×19, reglas japonesas, chinas, AGA y Tromp–Taylor, handicap 2–9, un oponente IA MCTS, dos jugadores, Rengo 2 contra 2, Atari-Go / Ponnuki-Go, NoGo, Phantom Go, un reloj byo-yomi, lecciones interactivas, problemas de tsume-go verificados por un solver e importación/exportación SGF. El atlas también enumera variantes que NO se pueden jugar aquí (marcadas «solo atlas»).","Go (Baduk, Weiqi, Igo) num único ficheiro HTML, offline. Tabuleiros de 5×5 a 19×19, regras japonesas, chinesas, AGA e Tromp–Taylor, handicap 2–9, um adversário IA MCTS, dois jogadores, Rengo 2 contra 2, Atari-Go / Ponnuki-Go, NoGo, Phantom Go, um relógio byo-yomi, lições interativas, problemas de tsume-go verificados por um solver e importação/exportação SGF. O atlas lista também variantes que NÃO são jogáveis aqui (marcadas «só atlas»).","Go (Baduk, Weiqi, Igo) in einer einzigen HTML-Datei, offline. Bretter von 5×5 bis 19×19, japanische, chinesische, AGA- und Tromp–Taylor-Regeln, Vorgabe 2–9, ein MCTS-KI-Gegner, zwei Spielende, Rengo 2 gegen 2, Atari-Go / Ponnuki-Go, NoGo, Phantom Go, eine Byo-yomi-Uhr, interaktive Lektionen, vom Solver geprüfte Tsume-Go-Aufgaben und SGF-Import/-Export. Der Atlas führt auch Varianten auf, die hier NICHT spielbar sind (als „nur Atlas“ gekennzeichnet).","Go (Baduk, Weiqi, Igo) egyetlen, offline HTML-fájlban. 5×5-től 19×19-ig terjedő táblák, japán, kínai, AGA és Tromp–Taylor szabályok, 2–9 előnykő, MCTS MI ellenfél, két játékos, 2 a 2 elleni Rengo, Atari-Go / Ponnuki-Go, NoGo, Phantom Go, byo-yomi óra, interaktív leckék, megoldóval ellenőrzött tsume-go feladatok és SGF import/export. Az atlasz olyan változatokat is felsorol, amelyek itt NEM játszhatók („csak atlasz” jelöléssel)."],"The app makes no network requests: no telemetry, analytics, external fonts or scripts (the page security policy allows nothing but its own script, a locally created Web Worker and embedded images). The only data saved are your preferences (language, settings, solved problems) in the browser's local storage, when available; the app works without it. Loaded SGF files are read locally and sent nowhere; only the main line is interpreted, with size and depth limits.":["L’application ne fait aucune requête réseau : ni télémétrie, ni analytique, ni polices ou scripts externes (la politique de sécurité de la page n’autorise que son propre script, un Web Worker créé localement et des images intégrées). Les seules données enregistrées sont vos préférences (langue, réglages, problèmes résolus) dans le stockage local du navigateur, lorsqu’il est disponible ; l’application fonctionne sans lui. Les fichiers SGF chargés sont lus localement et ne sont envoyés nulle part ; seule la ligne principale est interprétée, avec des limites de taille et de profondeur.","L’app non effettua alcuna richiesta di rete: niente telemetria, analisi, font o script esterni (la politica di sicurezza della pagina consente solo il proprio script, un Web Worker creato localmente e immagini incorporate). Gli unici dati salvati sono le tue preferenze (lingua, impostazioni, problemi risolti) nell’archivio locale del browser, quando disponibile; l’app funziona anche senza. I file SGF caricati vengono letti localmente e non inviati da nessuna parte; viene interpretata solo la linea principale, con limiti di dimensione e profondità.","La aplicación no hace ninguna petición de red: sin telemetría, analíticas, fuentes ni scripts externos (la política de seguridad de la página no permite nada salvo su propio script, un Web Worker creado localmente e imágenes incrustadas). Los únicos datos guardados son tus preferencias (idioma, ajustes, problemas resueltos) en el almacenamiento local del navegador, cuando está disponible; la aplicación funciona sin él. Los archivos SGF cargados se leen localmente y no se envían a ningún sitio; solo se interpreta la línea principal, con límites de tamaño y profundidad.","A aplicação não faz nenhum pedido de rede: sem telemetria, análises, tipos de letra ou scripts externos (a política de segurança da página não permite nada além do seu próprio script, de um Web Worker criado localmente e de imagens incorporadas). Os únicos dados guardados são as tuas preferências (idioma, definições, problemas resolvidos) no armazenamento local do navegador, quando disponível; a aplicação funciona sem ele. Os ficheiros SGF carregados são lidos localmente e não são enviados para lado nenhum; só a linha principal é interpretada, com limites de tamanho e profundidade.","Die App stellt keinerlei Netzwerkanfragen: keine Telemetrie, keine Analysen, keine externen Schriften oder Skripte (die Sicherheitsrichtlinie der Seite erlaubt nur das eigene Skript, einen lokal erzeugten Web Worker und eingebettete Bilder). Gespeichert werden nur deine Einstellungen (Sprache, Optionen, gelöste Aufgaben) im lokalen Speicher des Browsers, sofern verfügbar; die App funktioniert auch ohne. Geladene SGF-Dateien werden lokal gelesen und nirgendwohin gesendet; nur die Hauptlinie wird interpretiert, mit Größen- und Tiefenlimits.","Az alkalmazás semmilyen hálózati kérést nem küld: nincs telemetria, analitika, külső betűtípus vagy szkript (az oldal biztonsági irányelve a saját szkriptjén, egy helyben létrehozott Web Workeren és beágyazott képeken kívül semmit sem enged). Az egyetlen elmentett adat a beállításaid (nyelv, beállítások, megoldott feladatok) a böngésző helyi tárolójában, ha elérhető; az alkalmazás anélkül is működik. A betöltött SGF-fájlokat helyben olvassa be, és sehová nem küldi; csak a főág kerül értelmezésre, méret- és mélységkorlátokkal."],"It is not an LLM and has no neural network: MCTS (UCT + RAVE) with light playouts (captures/escapes from atari, 3×3 patterns, never filling its own eyes). Levels 1–5 = 0 / 100 / 500 / 2,500 / 10,000 iterations, with a time limit (so on 19×19 or on slow devices it plays weaker than the numbers suggest). Measured on 9×9, komi 7.5, alternating colours: L1 vs random 34–6 (40 games); L2 vs random 100–0 (100); L3 vs random 40–0 (40); L2 vs L1 40–0 (40); L3 vs L2 31–9 (40); L4 vs L3 21–9 (30); L5 vs L4 15–5 (20). With 20–40 games the uncertainty is about ±15–20 percentage points; these are AI-vs-AI matches, so the gaps may be overstated. Rank (order of magnitude only, not measured against humans): L1 ≈ 30 kyu or weaker, L2 ≈ 28–24, L3 ≈ 26–21, L4 ≈ 24–18, L5 ≈ 22–15 kyu on 9×9; much weaker on 19×19. The AI does not cheat: it receives only the board, the move history and the rules; in Phantom Go only its own stones and the revealed ones.":["Ce n’est pas un LLM et il n’y a pas de réseau de neurones : MCTS (UCT + RAVE) avec des simulations légères (captures/échappées d’atari, motifs 3×3, sans jamais remplir ses propres yeux). Niveaux 1–5 = 0 / 100 / 500 / 2 500 / 10 000 itérations, avec une limite de temps (donc en 19×19 ou sur des appareils lents il joue plus faiblement que ne le suggèrent les chiffres). Mesuré en 9×9, komi 7,5, couleurs alternées : N1 contre hasard 34–6 (40 parties) ; N2 contre hasard 100–0 (100) ; N3 contre hasard 40–0 (40) ; N2 contre N1 40–0 (40) ; N3 contre N2 31–9 (40) ; N4 contre N3 21–9 (30) ; N5 contre N4 15–5 (20). Avec 20–40 parties l’incertitude est d’environ ±15–20 points de pourcentage ; ce sont des matchs IA contre IA, les écarts peuvent donc être surestimés. Rang (ordre de grandeur seulement, non mesuré contre des humains) : N1 ≈ 30 kyu ou moins, N2 ≈ 28–24, N3 ≈ 26–21, N4 ≈ 24–18, N5 ≈ 22–15 kyu en 9×9 ; bien plus faible en 19×19. L’IA ne triche pas : elle ne reçoit que le plateau, l’historique des coups et les règles ; au Phantom Go seulement ses propres pierres et celles qui ont été révélées.","Non è un LLM e non ha una rete neurale: MCTS (UCT + RAVE) con simulazioni leggere (catture/fughe dall’atari, schemi 3×3, senza mai riempire i propri occhi). Livelli 1–5 = 0 / 100 / 500 / 2.500 / 10.000 iterazioni, con un limite di tempo (quindi su 19×19 o su dispositivi lenti gioca peggio di quanto suggeriscano i numeri). Misurato su 9×9, komi 7,5, colori alternati: L1 contro casuale 34–6 (40 partite); L2 contro casuale 100–0 (100); L3 contro casuale 40–0 (40); L2 contro L1 40–0 (40); L3 contro L2 31–9 (40); L4 contro L3 21–9 (30); L5 contro L4 15–5 (20). Con 20–40 partite l’incertezza è di circa ±15–20 punti percentuali; sono partite IA contro IA, quindi i divari possono essere sovrastimati. Livello (solo ordine di grandezza, non misurato contro umani): L1 ≈ 30 kyu o meno, L2 ≈ 28–24, L3 ≈ 26–21, L4 ≈ 24–18, L5 ≈ 22–15 kyu su 9×9; molto più debole su 19×19. L’IA non bara: riceve solo la tavola, la cronologia delle mosse e le regole; nel Phantom Go solo le proprie pietre e quelle rivelate.","No es un LLM y no tiene red neuronal: MCTS (UCT + RAVE) con simulaciones ligeras (capturas/escapes de atari, patrones 3×3, sin rellenar nunca sus propios ojos). Niveles 1–5 = 0 / 100 / 500 / 2.500 / 10.000 iteraciones, con límite de tiempo (por eso en 19×19 o en dispositivos lentos juega peor de lo que indican los números). Medido en 9×9, komi 7,5, colores alternos: N1 contra aleatorio 34–6 (40 partidas); N2 contra aleatorio 100–0 (100); N3 contra aleatorio 40–0 (40); N2 contra N1 40–0 (40); N3 contra N2 31–9 (40); N4 contra N3 21–9 (30); N5 contra N4 15–5 (20). Con 20–40 partidas la incertidumbre es de unos ±15–20 puntos porcentuales; son partidas IA contra IA, así que las diferencias pueden estar sobrestimadas. Nivel (solo orden de magnitud, no medido contra humanos): N1 ≈ 30 kyu o menos, N2 ≈ 28–24, N3 ≈ 26–21, N4 ≈ 24–18, N5 ≈ 22–15 kyu en 9×9; mucho más débil en 19×19. La IA no hace trampas: recibe solo el tablero, el historial de jugadas y las reglas; en Phantom Go solo sus propias piedras y las reveladas.","Não é um LLM e não tem rede neuronal: MCTS (UCT + RAVE) com simulações leves (capturas/fugas de atari, padrões 3×3, sem nunca preencher os próprios olhos). Níveis 1–5 = 0 / 100 / 500 / 2 500 / 10 000 iterações, com limite de tempo (por isso em 19×19 ou em dispositivos lentos joga pior do que os números sugerem). Medido em 9×9, komi 7,5, cores alternadas: N1 contra aleatório 34–6 (40 partidas); N2 contra aleatório 100–0 (100); N3 contra aleatório 40–0 (40); N2 contra N1 40–0 (40); N3 contra N2 31–9 (40); N4 contra N3 21–9 (30); N5 contra N4 15–5 (20). Com 20–40 partidas a incerteza é de cerca de ±15–20 pontos percentuais; são partidas IA contra IA, pelo que as diferenças podem estar sobrestimadas. Nível (apenas ordem de grandeza, não medido contra humanos): N1 ≈ 30 kyu ou menos, N2 ≈ 28–24, N3 ≈ 26–21, N4 ≈ 24–18, N5 ≈ 22–15 kyu em 9×9; muito mais fraco em 19×19. A IA não faz batota: recebe apenas o tabuleiro, o histórico de jogadas e as regras; no Phantom Go só as suas próprias pedras e as reveladas.","Sie ist kein LLM und hat kein neuronales Netz: MCTS (UCT + RAVE) mit leichten Simulationen (Schlagen/Befreien aus dem Atari, 3×3-Muster, nie die eigenen Augen füllen). Stufen 1–5 = 0 / 100 / 500 / 2.500 / 10.000 Iterationen, mit Zeitlimit (daher spielt sie auf 19×19 oder auf langsamen Geräten schwächer, als die Zahlen vermuten lassen). Gemessen auf 9×9, Komi 7,5, wechselnde Farben: S1 gegen Zufall 34–6 (40 Partien); S2 gegen Zufall 100–0 (100); S3 gegen Zufall 40–0 (40); S2 gegen S1 40–0 (40); S3 gegen S2 31–9 (40); S4 gegen S3 21–9 (30); S5 gegen S4 15–5 (20). Bei 20–40 Partien beträgt die Unsicherheit etwa ±15–20 Prozentpunkte; es sind KI-gegen-KI-Partien, die Abstände können also überzeichnet sein. Spielstärke (nur Größenordnung, nicht gegen Menschen gemessen): S1 ≈ 30 Kyu oder schwächer, S2 ≈ 28–24, S3 ≈ 26–21, S4 ≈ 24–18, S5 ≈ 22–15 Kyu auf 9×9; auf 19×19 viel schwächer. Die KI schummelt nicht: Sie erhält nur das Brett, den Zugverlauf und die Regeln; im Phantom Go nur ihre eigenen und die aufgedeckten Steine.","Nem LLM, és nincs neurális hálója: MCTS (UCT + RAVE) könnyű szimulációkkal (levételek/menekülés az atariból, 3×3 minták, a saját szemeit soha nem tölti ki). Az 1–5. szint = 0 / 100 / 500 / 2 500 / 10 000 iteráció, időkorláttal (ezért 19×19-en vagy lassú eszközökön gyengébben játszik, mint a számok sugallják). 9×9-en mérve, komi 7,5, váltakozó színekkel: 1. sz. véletlen ellen 34–6 (40 játszma); 2. sz. véletlen ellen 100–0 (100); 3. sz. véletlen ellen 40–0 (40); 2. sz. az 1. sz. ellen 40–0 (40); 3. sz. a 2. sz. ellen 31–9 (40); 4. sz. a 3. sz. ellen 21–9 (30); 5. sz. a 4. sz. ellen 15–5 (20). 20–40 játszmánál a bizonytalanság körülbelül ±15–20 százalékpont; ezek MI–MI mérkőzések, így a különbségek eltúlzottak lehetnek. Rang (csak nagyságrend, emberek ellen nem mérve): 1. sz. ≈ 30 kyu vagy gyengébb, 2. sz. ≈ 28–24, 3. sz. ≈ 26–21, 4. sz. ≈ 24–18, 5. sz. ≈ 22–15 kyu 9×9-en; 19×19-en jóval gyengébb. Az MI nem csal: csak a táblát, a lépéstörténetet és a szabályokat kapja; a Phantom Góban csak a saját és a felfedett köveit."],"• The AI is an MCTS with light playouts and simple heuristics, no neural network; on 19×19 it is slow and weak.\n• The territory estimate and the dead-stone suggestion are statistical and can be wrong: check and correct by hand.\n• Seki: points with shared liberties are neutral, but eyes inside a seki are not detected (⚠ approximation, relevant for Japanese counting).\n• Ko: simple (Japanese) or superko (positional/situational). With simple ko, long cycles (triple ko etc.) are NOT detected and “no result” does not exist (⚠); a game reaching 4·n² moves is stopped as a draw.\n• The official rules are reproduced from the author's memory and public summaries; they could not be checked online during the build session (⚠).\n• Phantom Go (⚠): the AI plays without seeing your hidden stones and may try occupied points; the final score is by area.\n• The “atlas only” variants (pair go, toroidal, hexagonal, three-player, Ing, New Zealand) are not implemented.":["• L’IA est un MCTS avec des simulations légères et des heuristiques simples, sans réseau de neurones ; en 19×19 elle est lente et faible.\n• L’estimation du territoire et la suggestion de pierres mortes sont statistiques et peuvent se tromper : vérifiez et corrigez à la main.\n• Seki : les points à libertés communes sont neutres, mais les yeux à l’intérieur d’un seki ne sont pas détectés (⚠ approximation, pertinente pour le décompte japonais).\n• Ko : simple (japonaises) ou superko (positionnel/situationnel). Avec le ko simple, les longs cycles (triple ko, etc.) ne sont PAS détectés et le « sans résultat » n’existe pas (⚠) ; une partie qui atteint 4·n² coups est arrêtée comme nulle.\n• Les règles officielles sont reproduites de mémoire par l’auteur et d’après des résumés publics ; elles n’ont pas pu être vérifiées en ligne pendant la session de construction (⚠).\n• Phantom Go (⚠) : l’IA joue sans voir vos pierres cachées et peut tenter des points occupés ; le score final est par surface.\n• Les variantes « atlas seulement » (pair go, toroïdal, hexagonal, à trois joueurs, Ing, Nouvelle-Zélande) ne sont pas implémentées.","• L’IA è un MCTS con simulazioni leggere e semplici euristiche, senza rete neurale; su 19×19 è lenta e debole.\n• La stima del territorio e il suggerimento delle pietre morte sono statistici e possono sbagliare: controlla e correggi a mano.\n• Seki: i punti con libertà comuni sono neutri, ma gli occhi all’interno di un seki non vengono rilevati (⚠ approssimazione, rilevante per il conteggio giapponese).\n• Ko: semplice (giapponesi) o superko (posizionale/situazionale). Con il ko semplice i cicli lunghi (triplo ko ecc.) NON vengono rilevati e il «nessun risultato» non esiste (⚠); una partita che raggiunge 4·n² mosse viene fermata come pareggio.\n• Le regole ufficiali sono riprodotte dalla memoria dell’autore e da riassunti pubblici; non è stato possibile verificarle online durante la sessione di sviluppo (⚠).\n• Phantom Go (⚠): l’IA gioca senza vedere le tue pietre nascoste e può provare punti occupati; il punteggio finale è per area.\n• Le varianti «solo atlante» (pair go, toroidale, esagonale, a tre giocatori, Ing, Nuova Zelanda) non sono implementate.","• La IA es un MCTS con simulaciones ligeras y heurísticas simples, sin red neuronal; en 19×19 es lenta y débil.\n• La estimación del territorio y la sugerencia de piedras muertas son estadísticas y pueden equivocarse: comprueba y corrige a mano.\n• Seki: los puntos con libertades compartidas son neutros, pero los ojos dentro de un seki no se detectan (⚠ aproximación, relevante para el recuento japonés).\n• Ko: simple (japonesas) o superko (posicional/situacional). Con ko simple, los ciclos largos (triple ko, etc.) NO se detectan y el «sin resultado» no existe (⚠); una partida que llega a 4·n² jugadas se detiene como tablas.\n• Las reglas oficiales se reproducen de memoria del autor y de resúmenes públicos; no se pudieron comprobar en línea durante la sesión de desarrollo (⚠).\n• Phantom Go (⚠): la IA juega sin ver tus piedras ocultas y puede probar puntos ocupados; la puntuación final es por área.\n• Las variantes «solo atlas» (pair go, toroidal, hexagonal, de tres jugadores, Ing, Nueva Zelanda) no están implementadas.","• A IA é um MCTS com simulações leves e heurísticas simples, sem rede neuronal; em 19×19 é lenta e fraca.\n• A estimativa de território e a sugestão de pedras mortas são estatísticas e podem errar: verifica e corrige à mão.\n• Seki: os pontos com liberdades partilhadas são neutros, mas os olhos dentro de um seki não são detetados (⚠ aproximação, relevante para a contagem japonesa).\n• Ko: simples (japonesas) ou superko (posicional/situacional). Com ko simples, os ciclos longos (triplo ko, etc.) NÃO são detetados e o «sem resultado» não existe (⚠); um jogo que chegue a 4·n² jogadas é parado como empate.\n• As regras oficiais são reproduzidas de memória do autor e de resumos públicos; não puderam ser verificadas online durante a sessão de desenvolvimento (⚠).\n• Phantom Go (⚠): a IA joga sem ver as tuas pedras ocultas e pode tentar pontos ocupados; a pontuação final é por área.\n• As variantes «só atlas» (pair go, toroidal, hexagonal, a três jogadores, Ing, Nova Zelândia) não estão implementadas.","• Die KI ist ein MCTS mit leichten Simulationen und einfachen Heuristiken, ohne neuronales Netz; auf 19×19 ist sie langsam und schwach.\n• Die Gebietsschätzung und der Vorschlag toter Steine sind statistisch und können falsch liegen: Prüfe und korrigiere von Hand.\n• Seki: Punkte mit gemeinsamen Freiheiten sind neutral, aber Augen innerhalb eines Seki werden nicht erkannt (⚠ Näherung, relevant für die japanische Zählung).\n• Ko: einfach (japanisch) oder Superko (positionell/situativ). Beim einfachen Ko werden lange Zyklen (Dreifach-Ko usw.) NICHT erkannt, und „kein Ergebnis“ gibt es nicht (⚠); eine Partie, die 4·n² Züge erreicht, wird als Unentschieden abgebrochen.\n• Die offiziellen Regeln sind aus dem Gedächtnis des Autors und aus öffentlichen Zusammenfassungen wiedergegeben; sie konnten während der Entwicklungssitzung nicht online geprüft werden (⚠).\n• Phantom Go (⚠): Die KI spielt, ohne deine verdeckten Steine zu sehen, und kann besetzte Punkte versuchen; die Endwertung erfolgt nach Fläche.\n• Die „nur Atlas“-Varianten (Pair Go, toroidal, hexagonal, für drei Spielende, Ing, Neuseeland) sind nicht umgesetzt.","• Az MI egy MCTS könnyű szimulációkkal és egyszerű heurisztikákkal, neurális háló nélkül; 19×19-en lassú és gyenge.\n• A területbecslés és a halott kövek javaslata statisztikai, és tévedhet: ellenőrizd és javítsd kézzel.\n• Seki: a közös szabadságú pontok semlegesek, de a seki belsejében lévő szemeket nem ismeri fel (⚠ közelítés, a japán számolásnál releváns).\n• Ko: egyszerű (japán) vagy superko (pozicionális/szituációs). Egyszerű kónál a hosszú ciklusokat (hármas ko stb.) NEM ismeri fel, és „nincs eredmény” nem létezik (⚠); az a játszma, amely eléri a 4·n² lépést, döntetlenként leáll.\n• A hivatalos szabályokat a szerző emlékezetéből és nyilvános összefoglalókból adtuk vissza; az összeállítás során online nem lehetett ellenőrizni őket (⚠).\n• Phantom Go (⚠): az MI a rejtett köveid látása nélkül játszik, és próbálkozhat foglalt pontokkal; a végső pontszám felületszámolású.\n• A „csak atlasz” változatok (pair go, toroidális, hatszögletű, háromszemélyes, Ing, Új-Zéland) nincsenek megvalósítva."],"Rules: Sensei's Library (Japanese rules, Chinese rules, AGA rules, Tromp–Taylor rules, Ko, Superko, Komi, Handicap, Seki, Scoring), the Tromp–Taylor rules (John Tromp), the American Go Association. SGF format: the FF[4] specification (red-bean.com). Benson's algorithm for unconditional life (D. B. Benson, 1976). MCTS/UCT: Kocsis & Szepesvári (2006); RAVE: Gelly & Silver (2007). All sources are cited from memory and were not re-checked online.":["Règles : Sensei’s Library (Japanese rules, Chinese rules, AGA rules, Tromp–Taylor rules, Ko, Superko, Komi, Handicap, Seki, Scoring), les règles Tromp–Taylor (John Tromp), l’American Go Association. Format SGF : la spécification FF[4] (red-bean.com). Algorithme de Benson pour la vie inconditionnelle (D. B. Benson, 1976). MCTS/UCT : Kocsis & Szepesvári (2006) ; RAVE : Gelly & Silver (2007). Toutes les sources sont citées de mémoire et n’ont pas été revérifiées en ligne.","Regole: Sensei’s Library (Japanese rules, Chinese rules, AGA rules, Tromp–Taylor rules, Ko, Superko, Komi, Handicap, Seki, Scoring), le regole Tromp–Taylor (John Tromp), l’American Go Association. Formato SGF: la specifica FF[4] (red-bean.com). Algoritmo di Benson per la vita incondizionata (D. B. Benson, 1976). MCTS/UCT: Kocsis & Szepesvári (2006); RAVE: Gelly & Silver (2007). Tutte le fonti sono citate a memoria e non sono state ricontrollate online.","Reglas: Sensei’s Library (Japanese rules, Chinese rules, AGA rules, Tromp–Taylor rules, Ko, Superko, Komi, Handicap, Seki, Scoring), las reglas Tromp–Taylor (John Tromp), la American Go Association. Formato SGF: la especificación FF[4] (red-bean.com). Algoritmo de Benson para la vida incondicional (D. B. Benson, 1976). MCTS/UCT: Kocsis & Szepesvári (2006); RAVE: Gelly & Silver (2007). Todas las fuentes se citan de memoria y no se han vuelto a comprobar en línea.","Regras: Sensei’s Library (Japanese rules, Chinese rules, AGA rules, Tromp–Taylor rules, Ko, Superko, Komi, Handicap, Seki, Scoring), as regras Tromp–Taylor (John Tromp), a American Go Association. Formato SGF: a especificação FF[4] (red-bean.com). Algoritmo de Benson para a vida incondicional (D. B. Benson, 1976). MCTS/UCT: Kocsis & Szepesvári (2006); RAVE: Gelly & Silver (2007). Todas as fontes são citadas de memória e não foram reverificadas online.","Regeln: Sensei’s Library (Japanese rules, Chinese rules, AGA rules, Tromp–Taylor rules, Ko, Superko, Komi, Handicap, Seki, Scoring), die Tromp–Taylor-Regeln (John Tromp), die American Go Association. SGF-Format: die Spezifikation FF[4] (red-bean.com). Bensons Algorithmus für unbedingtes Leben (D. B. Benson, 1976). MCTS/UCT: Kocsis & Szepesvári (2006); RAVE: Gelly & Silver (2007). Alle Quellen sind aus dem Gedächtnis zitiert und wurden nicht erneut online geprüft.","Szabályok: Sensei’s Library (Japanese rules, Chinese rules, AGA rules, Tromp–Taylor rules, Ko, Superko, Komi, Handicap, Seki, Scoring), a Tromp–Taylor szabályok (John Tromp), az American Go Association. SGF formátum: az FF[4] specifikáció (red-bean.com). Benson algoritmusa a feltétlen életre (D. B. Benson, 1976). MCTS/UCT: Kocsis & Szepesvári (2006); RAVE: Gelly & Silver (2007). Minden forrást emlékezetből idéztünk, és online nem ellenőriztük újra."],"Open index.html straight from the file (double-click) or serve the folder with any static server. No installation or internet needed.":["Ouvrez index.html directement depuis le fichier (double-clic) ou servez le dossier avec n’importe quel serveur statique. Aucune installation ni connexion à Internet n’est nécessaire.","Apri index.html direttamente dal file (doppio clic) oppure servi la cartella con qualsiasi server statico. Non servono installazione né internet.","Abre index.html directamente desde el archivo (doble clic) o sirve la carpeta con cualquier servidor estático. No necesita instalación ni internet.","Abre o index.html diretamente a partir do ficheiro (duplo clique) ou serve a pasta com qualquer servidor estático. Não é preciso instalação nem internet.","Öffne index.html direkt aus der Datei (Doppelklick) oder stelle den Ordner mit einem beliebigen statischen Server bereit. Keine Installation und kein Internet nötig.","Nyisd meg az index.html-t közvetlenül a fájlból (dupla kattintás), vagy szolgáld ki a mappát bármilyen statikus szerverrel. Nincs szükség telepítésre vagy internetre."],"Alexandru-Ionuț Chiuță (Alexio · “Echo of the Strings”), alexio@trom.tf. Licence MIT.":["Alexandru-Ionuț Chiuță (Alexio · « Ecoul Stringurilor »), alexio@trom.tf. Licence MIT.","Alexandru-Ionuț Chiuță (Alexio · «Ecoul Stringurilor»), alexio@trom.tf. Licenza MIT.","Alexandru-Ionuț Chiuță (Alexio · «Ecoul Stringurilor»), alexio@trom.tf. Licencia MIT.","Alexandru-Ionuț Chiuță (Alexio · «Ecoul Stringurilor»), alexio@trom.tf. Licença MIT.","Alexandru-Ionuț Chiuță (Alexio · „Ecoul Stringurilor“), alexio@trom.tf. Lizenz MIT.","Alexandru-Ionuț Chiuță (Alexio · „Ecoul Stringurilor”), alexio@trom.tf. MIT licenc."],"For each problem a brute-force solver (alpha-beta search with a transposition table, on the small area shown) confirmed that the first move given lets the player force the goal (the target stone captured, or the target group unconditionally alive by Benson's algorithm) within at most D plies against EVERY defence, including a pass; the set of winning moves was also checked at D+2 (stable). What it does NOT guarantee: ko, seki and “alive in seki” do not count as success; only simple ko is used (no superko); the area is isolated (stones marked with a square are treated as permanent walls, edges are real board edges); the solution is not claimed to be unique or shortest in a whole-board game. A problem the solver did not confirm was not included.":["Pour chaque problème, un solveur de force brute (recherche alpha-bêta avec table de transposition, sur la petite zone affichée) a confirmé que le premier coup indiqué permet au joueur de forcer l’objectif (pierre cible capturée, ou groupe cible vivant inconditionnellement selon l’algorithme de Benson) en au plus D demi-coups contre TOUTE défense, y compris la passe ; l’ensemble des coups gagnants a aussi été vérifié à D+2 (stable). Ce qu’il ne garantit PAS : le ko, le seki et « vivant en seki » ne comptent pas comme réussite ; seul le ko simple est utilisé (pas de superko) ; la zone est isolée (les pierres marquées d’un carré sont traitées comme des murs permanents, les bords sont de vrais bords du plateau) ; la solution n’est pas déclarée unique ni la plus courte dans une partie sur tout le plateau. Un problème que le solveur n’a pas confirmé n’a pas été inclus.","Per ogni problema, un solver a forza bruta (ricerca alfa-beta con tabella di trasposizione, sulla piccola area mostrata) ha confermato che la prima mossa indicata permette al giocatore di forzare l’obiettivo (pietra bersaglio catturata, oppure gruppo bersaglio incondizionatamente vivo secondo l’algoritmo di Benson) in al massimo D semimosse contro OGNI difesa, compreso il passo; anche l’insieme delle mosse vincenti è stato verificato a D+2 (stabile). Ciò che NON garantisce: ko, seki e «vivo in seki» non contano come successo; si usa solo il ko semplice (niente superko); l’area è isolata (le pietre segnate con un quadrato sono trattate come muri permanenti, i bordi sono veri bordi della tavola); la soluzione non è dichiarata unica né la più breve in una partita su tutta la tavola. Un problema che il solver non ha confermato non è stato incluso.","Para cada problema, un solver de fuerza bruta (búsqueda alfa-beta con tabla de transposición, sobre la pequeña área mostrada) confirmó que la primera jugada indicada permite al jugador forzar el objetivo (piedra objetivo capturada, o grupo objetivo incondicionalmente vivo según el algoritmo de Benson) en como máximo D semijugadas contra CUALQUIER defensa, incluido un pase; el conjunto de jugadas ganadoras se comprobó también a D+2 (estable). Lo que NO garantiza: el ko, el seki y «vivo en seki» no cuentan como éxito; solo se usa ko simple (sin superko); el área está aislada (las piedras marcadas con un cuadrado se tratan como muros permanentes, los bordes son bordes reales del tablero); no se afirma que la solución sea única ni la más corta en una partida de tablero completo. Un problema que el solver no confirmó no se incluyó.","Para cada problema, um solver de força bruta (pesquisa alfa-beta com tabela de transposição, na pequena área mostrada) confirmou que a primeira jogada indicada permite ao jogador forçar o objetivo (pedra alvo capturada, ou grupo alvo incondicionalmente vivo segundo o algoritmo de Benson) em, no máximo, D meias-jogadas contra QUALQUER defesa, incluindo um passe; o conjunto das jogadas vencedoras foi também verificado a D+2 (estável). O que NÃO garante: o ko, o seki e «vivo em seki» não contam como sucesso; usa-se apenas ko simples (sem superko); a área está isolada (as pedras marcadas com um quadrado são tratadas como muros permanentes, os bordos são bordos reais do tabuleiro); não se afirma que a solução seja única nem a mais curta num jogo de tabuleiro completo. Um problema que o solver não confirmou não foi incluído.","Für jede Aufgabe hat ein Brute-Force-Solver (Alpha-Beta-Suche mit Transpositionstabelle, auf dem gezeigten kleinen Bereich) bestätigt, dass der angegebene erste Zug es der spielenden Person erlaubt, das Ziel zu erzwingen (Zielstein geschlagen oder Zielgruppe nach Bensons Algorithmus unbedingt lebendig) – in höchstens D Halbzügen gegen JEDE Verteidigung, einschließlich Passen; die Menge der Gewinnzüge wurde außerdem bei D+2 geprüft (stabil). Was er NICHT garantiert: Ko, Seki und „lebendig im Seki“ zählen nicht als Erfolg; es wird nur einfaches Ko verwendet (kein Superko); der Bereich ist isoliert (mit einem Quadrat markierte Steine werden als dauerhafte Mauern behandelt, Ränder sind echte Brettränder); die Lösung wird nicht als eindeutig oder kürzeste in einer Ganzbrett-Partie behauptet. Eine Aufgabe, die der Solver nicht bestätigt hat, wurde nicht aufgenommen.","Minden feladatnál egy nyers erejű megoldó (alfa-béta keresés transzpozíciós táblával, a bemutatott kis területen) megerősítette, hogy a megadott első lépés lehetővé teszi a játékosnak a cél kikényszerítését (a célkő levétele, vagy a célcsoport Benson algoritmusa szerint feltétlen élete) legfeljebb D fél lépésben MINDEN védekezés ellen, passzt is beleértve; a nyerő lépések halmazát D+2-nél is ellenőrizték (stabil). Amit NEM garantál: a ko, a seki és az „élő szekiben” nem számít sikernek; csak egyszerű kót használ (superko nincs); a terület izolált (a négyzettel jelölt köveket állandó falként kezeli, a szélek valódi táblaszélek); a megoldásról nem állítjuk, hogy egyedi vagy a legrövidebb egy teljes táblás játszmában. Azt a feladatot, amelyet a megoldó nem erősített meg, nem vettük fel."],"Three in a row (kill)":["Trois alignés (tuer)","Tre in fila (uccidere)","Tres en línea (matar)","Três em linha (matar)","Drei in einer Reihe (töten)","Három egy sorban (ölés)"],"Bent three (kill)":["Trois coudés (tuer)","Tre piegati (uccidere)","Tres doblados (matar)","Três dobrados (matar)","Gebogene Drei (töten)","Hajlított három (ölés)"],"T-shaped four (kill)":["Quatre en T (tuer)","Quattro a T (uccidere)","Cuatro en T (matar)","Quatro em T (matar)","T-förmige Vier (töten)","T alakú négy (ölés)"],"Square four (kill)":["Quatre en carré (tuer)","Quattro a quadrato (uccidere)","Cuatro en cuadrado (matar)","Quatro em quadrado (matar)","Quadratische Vier (töten)","Négyzet alakú négy (ölés)"],"Bulky five (kill)":["Cinq massif (tuer)","Cinque massiccio (uccidere)","Cinco voluminoso (matar)","Cinco volumoso (matar)","Dicke Fünf (töten)","Terjedelmes öt (ölés)"],"Cross five (kill)":["Cinq en croix (tuer)","Cinque a croce (uccidere)","Cinco en cruz (matar)","Cinco em cruz (matar)","Kreuz-Fünf (töten)","Kereszt alakú öt (ölés)"],"Three in a row (live)":["Trois alignés (vivre)","Tre in fila (vivere)","Tres en línea (vivir)","Três em linha (viver)","Drei in einer Reihe (leben)","Három egy sorban (élet)"],"Bent three (live)":["Trois coudés (vivre)","Tre piegati (vivere)","Tres doblados (vivir)","Três dobrados (viver)","Gebogene Drei (leben)","Hajlított három (élet)"],"T-shaped four (live)":["Quatre en T (vivre)","Quattro a T (vivere)","Cuatro en T (vivir)","Quatro em T (viver)","T-förmige Vier (leben)","T alakú négy (élet)"],"Cross five (live)":["Cinq en croix (vivre)","Cinque a croce (vivere)","Cinco en cruz (vivir)","Cinco em cruz (viver)","Kreuz-Fünf (leben)","Kereszt alakú öt (élet)"],"Capture (corner)":["Capture (coin)","Cattura (angolo)","Captura (esquina)","Captura (canto)","Schlagen (Ecke)","Levétel (sarok)"],"Capture (edge)":["Capture (bord)","Cattura (bordo)","Captura (borde)","Captura (bordo)","Schlagen (Rand)","Levétel (szél)"]};
