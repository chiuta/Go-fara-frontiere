/* ---------- Brain: AI în Web Worker (blob:) sau pe firul principal ---------- */
const WORKER_GLUE = `
let cur = null;
function slice() {
  if (!cur) return; const c = cur; let done = false;
  try { done = c.th.step(c.ms || 30); } catch (e) { postMessage({ type: 'error', id: c.id, msg: String(e && e.message || e) }); cur = null; return; }
  const now = Date.now();
  if (c.kind === 'think') {
    if (now - c.last > 220 && !done) { c.last = now; postMessage({ type: 'progress', id: c.id, out: c.th.progress() }); }
    if (done) { postMessage({ type: 'done', id: c.id, out: c.th.out }); cur = null; return; }
  } else if (done) { const r = c.th.result(); postMessage({ type: 'est', id: c.id, own: r.own, dead: r.dead, playouts: r.playouts }); cur = null; return; }
  setTimeout(slice, 0);
}
onmessage = function (e) {
  const m = e.data;
  try {
    if (m.cmd === 'think') { cur = { kind: 'think', id: m.id, th: AI.Thinker(m.job), last: 0, ms: 30 }; setTimeout(slice, 0); }
    else if (m.cmd === 'estimate') { cur = { kind: 'est', id: m.id, th: AI.Estimator(m.job), ms: 30 }; setTimeout(slice, 0); }
    else if (m.cmd === 'stop') { if (cur && cur.id === m.id) cur.th.stop(); }
  } catch (err) { postMessage({ type: 'error', id: m.id, msg: String(err && err.message || err) }); cur = null; }
};
postMessage({ type: 'ready' });
`;
function Brain() {
  let worker = null, mode = 'main', nextId = 1, pending = new Map(), cur = null;
  function startWorker() {
    try {
      if (typeof Worker === 'undefined' || typeof Blob === 'undefined' || !URL.createObjectURL) throw new Error('fără Worker');
      const src = '"use strict";const Core=(' + GoCoreFactory.toString() + ')();const AI=(' + GoAIFactory.toString() + ')(Core);' + WORKER_GLUE;
      const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      worker = new Worker(url);
      worker.onmessage = ev => {
        const m = ev.data; if (m.type === 'ready') { mode = 'worker'; return; }
        const p = pending.get(m.id); if (!p) return;
        if (m.type === 'progress') { if (p.onProgress) p.onProgress(m.out); }
        else if (m.type === 'done') { pending.delete(m.id); p.resolve(m.out); }
        else if (m.type === 'est') { pending.delete(m.id); p.resolve(m); }
        else if (m.type === 'error') { pending.delete(m.id); p.reject(new Error(m.msg)); }
      };
      worker.onerror = () => { /* CSP / erori de worker -> revenim pe firul principal */
        const jobs = Array.from(pending.values()); worker = null; mode = 'main'; pending = new Map();
        jobs.forEach(j => { if (!j.done) j.restart(); });
      };
      mode = 'worker';
    } catch (e) { worker = null; mode = 'main'; }
  }
  startWorker();
  function runMain(kind, job, p) {
    let th; try { th = kind === 'think' ? AI.Thinker(job) : AI.Estimator(job); } catch (e) { p.reject(e); return; }
    p.main = th;
    let last = 0;
    function slice() {
      if (p.done) return;
      let d = false; try { d = th.step(20); } catch (e) { p.done = true; p.reject(e); return; }
      if (kind === 'think') {
        const now = Date.now();
        if (d) { p.done = true; p.resolve(th.out); return; }
        if (now - last > 220) { last = now; if (p.onProgress) p.onProgress(th.progress()); }
      } else if (d) { p.done = true; const r = th.result(); p.resolve({ own: r.own, dead: r.dead, playouts: r.playouts }); return; }
      setTimeout(slice, 0);
    }
    setTimeout(slice, 0);
  }
  function submit(kind, job, onProgress) {
    const id = nextId++;
    return new Promise((resolve, reject) => {
      const p = { resolve, reject, onProgress, done: false, id, kind, job };
      p.restart = () => { runMain(kind, job, p); };
      if (worker) { pending.set(id, p); cur = id; try { worker.postMessage({ cmd: kind === 'think' ? 'think' : 'estimate', id, job }); } catch (e) { pending.delete(id); worker = null; mode = 'main'; runMain(kind, job, p); } }
      else { cur = id; runMain(kind, job, p); }
      p.cancel = () => { p.done = true; };
      active.set(id, p);
      const wrap = (fn) => (v) => { active.delete(id); fn(v); };
      const r0 = p.resolve, j0 = p.reject; p.resolve = wrap(r0); p.reject = wrap(j0);
    });
  }
  const active = new Map();
  function stop() { /* „Oprește / Gândește mai puțin”: termină căutarea cu cel mai bun rezultat de până acum */
    active.forEach((p, id) => { if (p.main) p.main.stop(); else if (worker) worker.postMessage({ cmd: 'stop', id }); });
  }
  function abort() { active.forEach((p, id) => { p.done = true; if (p.main) p.main.stop(); else if (worker) worker.postMessage({ cmd: 'stop', id }); }); active.clear(); pending.clear(); }
  return { think: (job, cb) => submit('think', job, cb), estimate: job => submit('estimate', job), stop, abort, get mode() { return mode; } };
}
let brain = null;
function getBrain() { if (!brain) brain = Brain(); return brain; }

let boardSeq = 0;
function hoshiPoints(w, h) {
  if (w !== h) return [];
  const n = w;
  if (n === 9) return [[2, 2], [6, 2], [2, 6], [6, 6], [4, 4]];
  if (n === 13) return [[3, 3], [9, 3], [3, 9], [9, 9], [6, 6]];
  if (n === 19) { const o = []; for (const a of [3, 9, 15]) for (const b of [3, 9, 15]) o.push([a, b]); return o; }
  if (n === 7) return [[3, 3]]; if (n === 5) return [[2, 2]];
  return [];
}
function Board(opts) {
  const C = 40, M = 1.15, id = 'b' + (++boardSeq);
  let w = opts.w || opts.n, h = opts.h || w, view = null, hover = -1, cursor = -1, showCoords = opts.coords !== false, focused = false;

function phantomHuman(p) {

  const capt = []; for (let q = 0; q < before.length; q++) if (before[q] && !st.board[q]) capt.push(q);
  capt.forEach(q => { G.ph.known[1].delete(q); G.ph.known[2].delete(q); });
  G.phNote = capt.length ? t('phantom.captured', { n: capt.length }) : t('phantom.ok');

    const mv = out.move;

    if (st.board[mv] === 3 - ai) { G.ph.known[ai].add(mv); continue; } /* ocupat de adversar: AI-ul află și reîncearcă */
    const before = st.board.slice(); const r = Core.play(st, mv);
    if (r) { excl.push(mv); continue; }
    const capt = []; for (let q = 0; q < before.length; q++) if (before[q] && !st.board[q]) capt.push(q);
    capt.forEach(q => { G.ph.known[1].delete(q); G.ph.known[2].delete(q); });

/* ===== RUNDA 8 (C1a): „Masa de joc” — joc în doi P2P, analizor local, provocarea zilei, „de ce nu pot muta?”, tastatură + anunțuri, turneu Elo ===== */
(function () { for (const l in R8D) { UI[l] = UI[l] || {}; Object.assign(UI[l], R8D[l]); } if (!LANGS.includes('hu')) { LANGS.push('hu'); LANG_NAMES.hu = 'Magyar'; } })();
const R8 = window.TBL;
R8.setPrefix('go-fara-frontiere.r8.');
R8.announceFn = function (m) { if (!liveEl) return; liveEl.textContent = ''; setTimeout(() => { liveEl.textContent = m; }, 20); };

function r8t(k, v) { return t('r8.' + k, v); }
function r8pname(p) { return Core.coordName(p, G ? G.n : 19); }

/* ---------- „de ce nu pot muta?” ---------- */
function r8superkoAt(st, p) {
  try {
    const sim = Core.cloneState(st, true); if (Core.tryPlay(sim, p, true)) return 0;
    const target = Core.posKey(sim, sim.turn);
    const base = Core.newState({ n: G.n, rules: G.rules, setup: G.setup, toMove: G.first, captureTarget: st.captureTarget, noGo: st.noGo });
    let found = Core.posKey(base, base.turn) === target ? 0 : -1;
    for (let i = 0; i < st.moves.length; i++) {
      const m = st.moves[i], r = m[0] < 0 ? Core.pass(base) : Core.play(base, m[0]);
      if (r) break;
      if (Core.posKey(base, base.turn) === target) found = i + 1;
    }
    return found;
  } catch (e) { return -1; }
}
function whyText(p, r) {
  const pn = Core.coordName(p, G.n), st = G.st;
  switch (r) {
    case 'occupied': return r8t('why.occupied', { p: pn, c: colorName(st.board[p] || 1) });
    case 'ko': return r8t('why.ko', { p: pn });
    case 'superko': { const k = r8superkoAt(st, p); return r8t('why.superko', { p: pn, r: rulesLabel(), n: k > 0 ? r8t('why.superkoAt', { m: k }) : '' }); }
    case 'suicide': {
      if (st.noGo) return r8t('why.nogoSuicide', { p: pn });
      const b = st.board.slice(); b[p] = st.turn;
      return r8t('why.suicide', { p: pn, k: chainInfo(b, G.n, p).pts.length });
    }
    case 'nogo': { const b = st.board.slice(), k = Core.placeN(b, Core.topo(G.n), p, st.turn); return r8t('why.nogo', { p: pn, k: Math.max(1, k) }); }
    case 'over': return r8t('why.over');
    case 'bounds': return r8t('why.bounds', { p: pn });
    default: return reasonText(r);
  }
}
function r8whyBlocked() {
  if (!G) return;
  let m;
  if (G.phase === 'over') m = r8t('why.over');
  else if (G.phase === 'mark') m = r8t('why.mark');
  else if (G.online && G.st.turn !== G.online.mine) m = r8t('why.online', { c: colorName(G.st.turn) });
  else if (G.busy) m = r8t('why.aiBusy');
  else m = r8t('why.notTurn', { c: colorName(G.st.turn) });
  say(m);
}
function r8whyHere(fromButton) {
  if (!G || !boardUI || G.mode === 'phantom') return;
  const p = boardUI.cursor;
  const refocus = () => { if (fromButton) { const b = $('#whybtn'); if (b) try { b.focus(); } catch (e) { /* ignorat */ } } };
  if (p < 0) { say(r8t('why.pick')); refocus(); return; }
  if (G.phase !== 'play' || G.busy || !humanTurn()) { r8whyBlocked(); refocus(); return; }
  if (G.st.board[p] !== 0) { say(whyText(p, 'occupied')); refocus(); return; }
  const r = Core.tryPlay(G.st, p, false);
  if (r) { say(whyText(p, r)); refocus(); return; }
  const b = G.st.board.slice(), k = Core.placeN(b, Core.topo(G.n), p, G.st.turn);
  say(r8t('why.legal', { p: Core.coordName(p, G.n), x: k > 0 ? r8t('why.legalCaps', { k }) : '' })); refocus();
}

/* ---------- tastatură + anunțuri ---------- */
function r8describe(p) {
  if (!G || G.mode === 'phantom') return null;
  const pn = Core.coordName(p, G.n), b = G.st.board;
  if (b[p]) return r8t('ptStone', { p: pn, c: colorName(b[p]), k: chainInfo(b, G.n, p).libs.length });
  if (G.phase === 'play' && humanTurn() && !G.busy) { const r = Core.tryPlay(G.st, p, false); return r ? r8t('ptIllegal', { p: pn, r: reasonText(r) }) : r8t('ptEmpty', { p: pn }); }
  return r8t('ptPlain', { p: pn });
}
function r8lastText() {
  if (!G || !G.st.moves.length || G.mode === 'phantom') return r8t('lastNone');
  return r8t('last', { l: G.st.moves.slice(-6).map(m => colorName(m[1]) + ' ' + (m[0] < 0 ? t('pass') : Core.coordName(m[0], G.n))).join(', ') });
}
function r8stateText() { return r8t('state', { n: G.st.moveNo, c: colorName(G.st.turn), b: G.st.caps[1], w: G.st.caps[2] }); }
function r8boardKeys(ev) {
  if (!G || ev.ctrlKey || ev.metaKey || ev.altKey) return false;
  const k = ev.key.toLowerCase();
  if (k === 'w') { ev.preventDefault(); r8whyHere(false); return true; }
  if (k === 'c') { ev.preventDefault(); const p = boardUI ? boardUI.cursor : -1; if (p >= 0) announce(r8describe(p) || r8pname(p)); return true; }
  if (k === 'l') { ev.preventDefault(); announce(r8lastText()); return true; }
  if (k === 's') { ev.preventDefault(); announce(r8stateText()); return true; }
  if (ev.key === '?') { ev.preventDefault(); announce(r8t('kbHelp')); return true; }
  return false;
}

function r8netSend(m) {
  const c = R8NET.ctrl; if (!c || !c.open) return;

}

function r8buildGame(cfg, mine, moves) {
  if (G) { G.token++; getBrain().abort(); stopTicker(); }
  const saved = setup, savedP = prefs.setup;
  setup = Object.assign({}, SETUP_DEFAULT, { confirm: saved.confirm, coords: saved.coords }, cfg, { mode: 'hot', clock: false, seed: '', color: 'black', seats: SETUP_DEFAULT.seats.slice() });
  try { sanitizeSetup(setup); startGame(); } finally { setup = saved; prefs.setup = savedP; savePrefs(); }
  G.online = { mine, ctrl: R8NET.ctrl, conf: { 1: false, 2: false } };

}
function r8netBar() {

    state: function () {
      const c = R8NET.ctrl, open = !!(c && c.open), on = !!(G && G.online);

      const pend = c && c.pendingOffer ? { o: c.pendingOffer.o, fromMe: c.pendingOffer.from === c.role } : null;
      return { online: open && on, status: st, pending: pend, over: !!(G && G.phase === 'over'), busy: false, extra: (on && G.phase === 'mark') ? [{ kind: 'resume', label: r8t('netResumeBtn') }] : [] };

    firstLabel: t('black'), secondLabel: t('white'), aiOptions: [1, 2, 3, 4, 5], aiName: l => r8t('aiName', { l }),
    extraFields: function (form) {
      const id = R8.uid('c1a-ts'), sel = E('select', { id });
      [5, 7, 9].forEach(n => sel.appendChild(E('option', { value: String(n), text: n + '×' + n })));
      sel.value = '7';
      form.appendChild(E('div', { class: 'c1a-row' }, [E('label', { for: id, text: r8t('tourSize') }), sel]));
      return function () { return { n: parseInt(sel.value, 10) || 7 }; };
    },
    extraInfo: function (x) { return r8t('tourInfo', { n: x.n || 7, k: fmtNum(r8tourKomi(x.n || 7)) }); },
    play: r8tourPlay, sim: r8sim
  });
}

/* ---------- finalul partidei: turneu + provocarea zilei ---------- */
function r8onFinish(res) {
  if (!G) return;
  try {
    if (G.tour && R8TOUR) {
      const resA = res.draw ? 0.5 : (res.winner === 1 ? 1 : 0);
      if (R8TOUR.record(G.tour.mid, resA, 'play')) { const tx = resA === 1 ? '1–0' : (resA === 0 ? '0–1' : '½–½'); announce(r8t('tourRec', { r: tx })); }
      G.tour = null;
    }
    if (G.daily) {
      const won = !res.draw && res.winner === G.humanColor;
      if (won) { R8.daily.markDone('go-game', G.daily.day); announce(r8t('dayWon')); } else announce(r8t('dayLost'));
    }
  } catch (e) { /* ignorat */ }
}
function r8banner(side) {
  if (!G) return;
  if (G.daily) side.appendChild(el('p', { class: 'note', text: r8t('dayBanner', { d: G.daily.day, l: G.daily.level }) }));
  else if (G.tour && G.tour.label) side.appendChild(el('p', { class: 'note', text: G.tour.label }));
}

/* ---------- hub ---------- */
function r8netPane(host) {
  R8.clear(host);
  const E = R8.el;
  host.appendChild(E('h3', { text: r8t('netTitle') }));
  host.appendChild(E('p', { text: r8t('netIntro') }));
  host.appendChild(E('p', { class: 'c1a-note', text: r8t('netLimits') }));
  if (LANG === 'hu') host.appendChild(E('p', { class: 'c1a-note', text: r8t('huNote') }));
  if (!R8.net.available()) { host.appendChild(E('p', { class: 'c1a-err', role: 'alert', text: R8.t('net.kit') })); return; }
  if (!R8.net.supported()) { host.appendChild(E('p', { class: 'c1a-err', role: 'alert', text: R8.t('net.unsupported') })); return; }
  if (G && G.online && R8NET.ctrl && R8NET.ctrl.open) {
    host.appendChild(E('p', { class: 'c1a-ok', role: 'status', text: r8t('netSide', { col: colorName(G.online.mine) }) }));
    const cb = E('button', { type: 'button', class: 'c1a-btn', text: R8.t('net.disconnect') });
    cb.addEventListener('click', () => { r8netClose(); r8netPane(host); });
    host.appendChild(E('div', { class: 'c1a-row' }, cb));
    return;
  }
  const go = E('button', { type: 'button', class: 'c1a-btn c1a-pri', 'data-c1a-focus': '', text: r8t('netStart') });
  go.addEventListener('click', r8startNet); host.appendChild(E('div', { class: 'c1a-row' }, go));
}
function r8accPane(host) {
  R8.accessPane(host, function (c) {
    const E = R8.el;
    c.appendChild(E('h3', { text: R8.t('tab.access') }));
    c.appendChild(E('p', { text: r8t('kbHelp') }));
    c.appendChild(E('p', { class: 'c1a-note', text: r8t('accVoiceNote') }));
    const id = R8.uid('c1a-jmp'), inp = E('input', { type: 'text', id, maxlength: '4', autocomplete: 'off', spellcheck: 'false', placeholder: 'D4' });
    const btn = E('button', { type: 'button', class: 'c1a-btn', text: r8t('jumpGo') }), msg = E('p', { class: 'c1a-msg', role: 'status' });
    const jump = () => {
      if (!G || !boardUI) { msg.textContent = r8t('jumpNo'); return; }
      const p = Core.parseCoord(inp.value, G.n);
      if (p < 0) { msg.textContent = r8t('jumpBad'); return; }
      msg.textContent = r8t('jumpOk', { p: Core.coordName(p, G.n) }); boardUI.setCursor(p);
      if (R8HUB) R8HUB.close();
      setTimeout(() => { if (boardUI) boardUI.focus(); }, 30);
    };
    btn.addEventListener('click', jump); inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); jump(); } });
    c.appendChild(E('div', { class: 'c1a-row' }, [E('label', { for: id, text: r8t('jumpLabel') }), inp, btn]));
    c.appendChild(msg);
  });
}
function r8openHub(initial) {
  if (R8HUB && R8HUB.dlg && R8HUB.dlg.isConnected) return;
  R8HUB = R8.hub(r8t('hubTitle'), [
    { id: 'net', label: R8.t('tab.net'), render: r8netPane },
    { id: 'analysis', label: R8.t('tab.analysis'), render: r8anPane },
    { id: 'daily', label: R8.t('tab.daily'), render: r8dayPane },
    { id: 'tour', label: R8.t('tab.tour'), render: r8tourPane },
    { id: 'access', label: R8.t('tab.access'), render: r8accPane }
  ], initial || 'net');
}
function r8leave() { if (G && G.online) r8netClose(); R8AN.token++; }
window.__go8 = { G: () => G, boardUI: () => boardUI, net: R8NET, ad: R8NETAD, hub: r8openHub, why: whyText, daily: r8dailyGen, tour: r8tour, sim: r8sim, analyze: r8analyzeNow, evalPos: r8evalPos, startDaily: r8startDaily, dailyProb: r8dailyProbIndex, describe: r8describe, buildGame: r8buildGame, get last() { return R8.lastAnalysis; }, get review() { return R8.lastReview; } };

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

</script>
