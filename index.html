        try { if (s.open) dc.send(JSON.stringify({_fff: 'ping', ts: Date.now()})); } catch (e) { /* ignorat */ }
        const idle = Date.now() - lastSeen;
        if (idle > hb.timeout && state === 'open') { lostSince = Date.now(); set('lost'); emit('lost'); }
        else if (state === 'lost' && Date.now() - lostSince > hb.giveUp) finish('timeout');
      }, hb.interval);
    }
    s._bind = function (ch) {
      dc = ch;
      ch.onopen = () => { clearTimeout(connTimer); set('open'); startHb(); emit('open', s); };
      ch.onmessage = e => {
        if (typeof e.data !== 'string' || e.data.length > MAX_MSG) return;
        let o; try { o = JSON.parse(e.data); } catch (er) { return; }
        if (!o || typeof o !== 'object' || Array.isArray(o)) return;
        lastSeen = Date.now(); received++;
        if (state === 'lost') { set('open'); emit('recovered'); }
        if (o._fff) return internal(o);
        emit('message', o);
      };
      ch.onclose = () => { if (!closed) finish('channel-closed'); };
      ch.onerror = () => { /* detaliile vin prin starea conexiunii */ };
      if (ch.readyState === 'open') ch.onopen();
    };
    s._armConnect = function () {
      clearTimeout(connTimer);
      connTimer = setTimeout(() => { if (!closed && state !== 'open') { emit('error', coded('timeout', 'failed')); finish('timeout'); } }, hb.connect);
    };
    pc.onconnectionstatechange = () => {
      const c = pc.connectionState;
      if (c === 'failed') { emit('error', coded('ice-failed', 'failed')); finish('failed'); }
      else if (c === 'disconnected' && state === 'open') { lostSince = Date.now(); set('lost'); emit('lost'); }
      else if (c === 'connected' && state === 'lost') { set('open'); emit('recovered'); }

  }

  async function prepare(opts) {
    if (!supported()) throw coded('unsupported', 'unsupported');
    return new RTCPeerConnection(rtcConfig(opts));
  }
  async function gather(pc, opts, gp) {
    await gp;
    const sdp = pc.localDescription && pc.localDescription.sdp;
    if (!sdp || !/^a=candidate:/m.test(sdp)) throw coded('no-candidates', 'noCandidates');
    return sdp;
  }

  /** Gazdă: returnează o sesiune cu .offer (cod text); apoi accept(răspuns). */
  async function host(opts) {
    opts = opts || {};
    const pc = await prepare(opts), s = createSession('host', pc, opts);
    try {
      s._bind(pc.createDataChannel('fff', {ordered: true}));
      s._setState('gathering');
      const gp = watchGathering(pc, opts);
      await pc.setLocalDescription(await pc.createOffer());
      s.offer = await encodeSignal('offer', await gather(pc, opts, gp));
    } catch (e) { try { pc.close(); } catch (er) { /* ignorat */ } throw e; }
    s._setState('waiting-answer');
    s.accept = async function (code) {
      const r = await decodeSignal(code);
      if (r.kind !== 'answer') throw coded('wrong-kind', 'wrongKind', {want: T('kindAnswer'), got: T('kindOffer')});
      await pc.setRemoteDescription({type: 'answer', sdp: r.sdp});
      s._setState('connecting'); s._armConnect();
    };
    return s;
  }
  /** Oaspete: primește oferta (cod) și returnează o sesiune cu .answer (cod text). */
  async function join(offerCode, opts) {
    opts = opts || {};
    if (!supported()) throw coded('unsupported', 'unsupported');
    const r = await decodeSignal(offerCode);
    if (r.kind !== 'offer') throw coded('wrong-kind', 'wrongKind', {want: T('kindOffer'), got: T('kindAnswer')});
    const pc = await prepare(opts), s = createSession('guest', pc, opts);
    try {
      s._setState('gathering');
      await pc.setRemoteDescription({type: 'offer', sdp: r.sdp});
      const gp = watchGathering(pc, opts);
      await pc.setLocalDescription(await pc.createAnswer());
      s.answer = await encodeSignal('answer', await gather(pc, opts, gp));
    } catch (e) { try { pc.close(); } catch (er) { /* ignorat */ } throw e; }
    s._setState('connecting'); s._armConnect();
    return s;
  }

  /* ======================= sesiune de joc: lockstep cu gazdă autoritară ======================= */
  function mulberry(seed) {
    let a = seed >>> 0;
    const f = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    f.getState = () => a; f.setState = v => { a = v >>> 0; };
    return f;
  }
  function randSeed() { try { return crypto.getRandomValues(new Uint32Array(1))[0]; } catch (e) { return (Math.random() * 4294967296) >>> 0; } }

  /**
   * lockstep(session, {seed, onMove(move,info), onState(state,info), validate(move,ctx), snapshot(), hash(), onChat(text,from), onError(err), timeout, history})
   * Gazda atribuie seq, validează și difuzează; oaspetele aplică mutările doar în ordinea seq (resincronizare la lipsuri/divergență).
   */
  function lockstep(session, o) {
    o = o || {};
    let sess = session, seq = 0, seed = o.seed != null ? o.seed >>> 0 : randSeed(), rng = mulberry(seed), started = false, stopped = false, cid = 0, helloTries = 0, helloTimer = 0;
    const isHost = () => sess.role === 'host', log = [], ahead = new Map(), pending = new Map(), offs = [];
    const AHEAD_MAX = 256;
    const keep = o.history || 500, stats = {resyncs: 0, rejected: 0, dupes: 0, applied: 0};
    const fail = (reason, extra) => { const e = Object.assign(new Error(reason), {code: reason}, extra || {}); if (o.onError) o.onError(e); return e; };
    const send = m => sess.send(m);
    const tryApply = (move, info) => {
      let r;
      try { r = o.onMove ? o.onMove(move, info) : undefined; } catch (e) { return {ok: false, reason: String(e && e.message || e)}; }
      if (r === false) return {ok: false, reason: 'rejected'};
      if (typeof r === 'string') return {ok: false, reason: r};
      return {ok: true};
    };
    function snapshotMsg() {
      const m = {t: 'sync', seq, seed, rng: rng.getState()};
      if (o.snapshot) m.state = o.snapshot();
      return m;
    }
    function begin(reason, st) {
      if (!started) { started = true; clearTimeout(helloTimer); }
      if (o.onState) o.onState(st, {reason, seq, seed, rng: rng.getState()});
    }
    function applyRemote(m) {                                  // oaspete: o mutare numerotată de la gazdă
      if (m.seq <= seq) { stats.dupes++; return; }
      if (m.seq > seq + 1) {
        if (m.seq - seq > AHEAD_MAX || ahead.size >= AHEAD_MAX) { send({t: 'need', from: seq}); return; }   // plafon: un partener rău nu umple memoria
        ahead.set(m.seq, m); send({t: 'need', from: seq}); return;
      }
      const mine = m.from === 'guest' && pending.has(m.cid);
      const r = tryApply(m.move, {seq: m.seq, from: m.from, mine, rng});
      if (!r.ok) { fail('diverged', {detail: r.reason}); stats.resyncs++; send({t: 'need', from: seq, force: true}); return; }
      seq = m.seq; stats.applied++;
      if (mine) { const p = pending.get(m.cid); pending.delete(m.cid); clearTimeout(p.timer); p.resolve({seq, ok: true}); }
      if (o.hash && m.h != null && String(o.hash()) !== String(m.h)) { stats.resyncs++; send({t: 'need', from: seq, force: true}); return; }
      const nx = ahead.get(seq + 1); if (nx) { ahead.delete(seq + 1); applyRemote(nx); }
    }
    function hostApply(move, from, cidv) {                     // gazdă: validează, aplică, numerotează, difuzează
      if (move == null || typeof move !== 'object') return {ok: false, reason: 'bad-move'};
      if (o.validate) { const v = o.validate(move, {from, seq: seq + 1}); if (v !== true && v !== undefined) return {ok: false, reason: typeof v === 'string' ? v : 'invalid'}; }
      const r = tryApply(move, {seq: seq + 1, from, mine: from === 'host', rng});
      if (!r.ok) return r;
      seq++; stats.applied++;
      log.push({seq, move, from}); if (log.length > keep) log.shift();
      const m = {t: 'move', seq, move, from}; if (cidv != null) m.cid = cidv; if (o.hash) m.h = o.hash();
      send(m);
      return {ok: true, seq};
    }
    function onMsg(m) {
      if (stopped || !m || typeof m.t !== 'string') return;
      if (isHost()) {
        if (m.t === 'hello') { send(snapshotMsg()); }
        else if (m.t === 'move') {
          const r = hostApply(m.move, 'guest', m.cid);
          if (!r.ok) { stats.rejected++; send({t: 'reject', cid: m.cid, reason: r.reason}); }
        } else if (m.t === 'need') {
          const from = Number.isInteger(m.from) ? m.from : -1;
          if (!m.force && log.length && log[0].seq <= from + 1 && from <= seq) send({t: 'moves', list: log.filter(e => e.seq > from)});
          else if (o.snapshot) { stats.resyncs++; send(Object.assign(snapshotMsg(), {resync: true})); }
          else send({t: 'fatal', reason: 'no-history'});
        } else if (m.t === 'chat' && o.onChat && typeof m.text === 'string') o.onChat(m.text.slice(0, 2000), 'guest');
        return;
      }
      if (m.t === 'sync') {                                    // oaspete
        if (!Number.isInteger(m.seq) || !Number.isInteger(m.seed) || m.seq < 0) return;
        if (!m.resync && started && m.seq === seq && m.seed === seed) return;     // idempotent
        if (m.state !== undefined || m.seq === 0) {            // stare completă sau început de joc
          const first = !started;
          seq = m.seq; seed = m.seed >>> 0; rng = mulberry(seed);
          if (Number.isInteger(m.rng)) rng.setState(m.rng);
          ahead.clear(); begin(first ? 'start' : 'resync', m.state);
        } else if (m.seq > seq) {                              // gazda e înainte, fără instantaneu: cere mutările
          if (!started) { seed = m.seed >>> 0; rng = mulberry(seed); started = true; clearTimeout(helloTimer); }
          send({t: 'need', from: seq});
        } else fail('diverged');
      } else if (m.t === 'move') { if (started && Number.isInteger(m.seq) && m.move && typeof m.move === 'object') applyRemote(m); }
      else if (m.t === 'moves' && Array.isArray(m.list)) { m.list.slice(0, keep).forEach(e => { if (e && Number.isInteger(e.seq) && e.move && typeof e.move === 'object') applyRemote({t: 'move', seq: e.seq, move: e.move, from: e.from === 'host' ? 'host' : 'guest'}); }); }
      else if (m.t === 'reject') { const p = pending.get(m.cid); if (p) { pending.delete(m.cid); clearTimeout(p.timer); p.reject(Object.assign(new Error(String(m.reason || 'rejected')), {code: 'rejected'})); } }
      else if (m.t === 'fatal') fail(String(m.reason || 'fatal'));
      else if (m.t === 'chat' && o.onChat && typeof m.text === 'string') o.onChat(m.text.slice(0, 2000), 'host');
    }
    function bind() {
      offs.forEach(f => f()); offs.length = 0;
      offs.push(sess.on('message', onMsg));
      offs.push(sess.on('open', start));
      offs.push(sess.on('close', () => { pending.forEach(p => { clearTimeout(p.timer); p.reject(Object.assign(new Error('closed'), {code: 'closed'})); }); pending.clear(); }));
      if (sess.open) start();
    }
    function start() {
      if (isHost()) { if (!started) { started = true; begin('start'); } send(snapshotMsg()); }
      else { helloTries = 0; hello(); }
    }
    function hello() {
      clearTimeout(helloTimer);
      if (stopped) return;
      if (helloTries++ >= 8) { if (!started) fail('no-sync'); return; }
      send({t: 'hello', seq});
      helloTimer = setTimeout(() => { if (!started) hello(); }, 1500);
    }
    const api = {
      get seq() { return seq; }, get seed() { return seed; }, get role() { return sess.role; }, get stats() { return Object.assign({}, stats); },
      rng: () => rng(), get rngState() { return rng.getState(); },
      /** Trimite o mutare. Gazdă: aplică imediat; oaspete: așteaptă ecoul numerotat al gazdei. Returnează Promise<{seq}>. */
      move(move) {
        if (stopped) return Promise.reject(Object.assign(new Error('stopped'), {code: 'stopped'}));
        if (isHost()) {
          const r = hostApply(move, 'host');
          return r.ok ? Promise.resolve({seq: r.seq, ok: true}) : Promise.reject(Object.assign(new Error(r.reason), {code: 'rejected'}));
        }
        if (!sess.open) return Promise.reject(Object.assign(new Error('closed'), {code: 'closed'}));
        const id = ++cid;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => { pending.delete(id); reject(Object.assign(new Error('timeout'), {code: 'timeout'})); }, o.timeout || 8000);
          pending.set(id, {resolve, reject, timer});
          if (!send({t: 'move', cid: id, move})) { clearTimeout(timer); pending.delete(id); reject(Object.assign(new Error('closed'), {code: 'closed'})); }
        });
      },
      chat(text) { return send({t: 'chat', text: String(text).slice(0, 2000)}); },
      /** Cere resincronizarea completă (oaspete) sau retrimite starea (gazdă). */
      resync() { if (isHost()) return send(snapshotMsg()); return send({t: 'need', from: seq, force: true}); },
      /** După o reconectare: leagă aceeași stare de joc la o sesiune nouă. */
      rebind(newSession) { sess = newSession; bind(); },
      stop() { stopped = true; clearTimeout(helloTimer); offs.forEach(f => f()); offs.length = 0; }
    };
    bind();
    return api;
  }

:root{--bg:#0d0a08;--bg2:#1a140d;--bg3:#2a2010;--ink:#f0e6d0;--muted:#c2b497;--gold:#c8832a;--gold2:#e8c87a;--line:#c8832a55;--red:#ff9c8c;--ok:#9be39b;--warn:#ffd27a;--focus:#7cc4ff;
--fd:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;--fb:'Iowan Old Style',Georgia,'Times New Roman',serif;--fu:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.55;min-height:100vh;padding-bottom:84px;overflow-x:hidden}
a{color:var(--gold2)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
button,select,input,textarea{font:inherit;color:inherit}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

.ctrls{display:flex;gap:8px;align-items:center;font-family:var(--fu);font-size:.9rem}
.ctrls label{color:var(--muted)}
select,.btn,input,textarea,.sel{font-family:var(--fu)}

textarea{padding:10px 12px;width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
input[type=file]{min-height:44px;max-width:100%;font-family:var(--fu);font-size:.9rem}
select{padding-right:8px;max-width:100%}

.btn:hover{border-color:var(--gold)}
.btn.pri{background:linear-gradient(#d8963a,#b8751f);color:#140c02;border-color:#e8c87a}
.btn.big{min-height:52px;font-size:1.02rem}
.btn.sm{min-height:44px;padding:4px 10px}

.btn.done{border-color:#9be39b88}

.tabs{display:flex;gap:6px;padding:12px 0;overflow-x:auto;border-bottom:1px solid var(--line)}

h1,h2,h3,h4{font-family:var(--fd);font-weight:600;line-height:1.2}
h2{font-size:1.6rem;margin:.8em 0 .3em;color:var(--gold2)}
h3{font-size:1.2rem;margin:.6em 0 .3em}
h4{margin:.4em 0 .1em;color:var(--gold2)}
.lead{color:var(--muted);font-family:var(--fu);font-size:.97rem;max-width:760px}
.note,.hint,.sml,small.hint{color:var(--muted);font-family:var(--fu);font-size:.85rem}
.ennote{color:var(--warn);font-family:var(--fu);font-size:.85rem}
.warnline{color:var(--warn);font-family:var(--fu);font-size:.9rem;margin:.4em 0}
.card{background:linear-gradient(#1f180e,#151008);border:1px solid var(--line);border-radius:var(--r);padding:16px;max-width:860px}
.fld{display:flex;flex-direction:column;gap:4px;margin:8px 0;min-width:0}
.fld label,.chk{font-family:var(--fu);font-size:.92rem}
.chk{display:flex;align-items:center;gap:8px;min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
.actions,.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
details.adv{margin:8px 0}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-family:var(--fu)}
.playgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px;align-items:start;margin-top:14px}
.boardcol{min-width:0;max-width:max(340px,calc(100vh - 210px))}
.boardscroll{overflow:auto;max-width:100%;border-radius:12px;-webkit-overflow-scrolling:touch}
.boardscroll.small{max-width:min(100%,400px)}
.boardwrap{width:100%;transition:width .15s}
@media (prefers-reduced-motion:reduce){.boardwrap{transition:none}.spinner{animation:none!important}}
svg.goboard{display:block;width:100%;height:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border-radius:10px}
svg.goboard:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.zoombar{display:flex;gap:6px;align-items:center;margin:8px 0}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#00000030;min-width:0}

.pn{display:flex;flex-direction:column;min-width:0;font-family:var(--fu);font-size:.9rem}
.pn b{overflow-wrap:anywhere}
.dot{width:24px;height:24px;border-radius:50%;flex:none;border:1px solid #888}
.dot.c1{background:radial-gradient(circle at 35% 30%,#666,#000)}
.dot.c2{background:radial-gradient(circle at 35% 30%,#fff,#bbb)}
.clk{margin-left:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.05rem;color:var(--gold2)}
.ginfo{margin:8px 0;font-family:var(--fu);font-size:.9rem;color:var(--muted)}

.pendingbar,.confirmbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;border:1px dashed var(--gold);border-radius:10px;margin:8px 0;font-family:var(--fu)}

.lastmoves,.phnote{font-family:var(--fu);color:var(--muted);margin:6px 0}

.fiche h3{margin:.1em 0 .3em;color:var(--gold2)}
.fiche p{font-family:var(--fu);font-size:.93rem;margin:.4em 0}
.chips,.filters{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}

.stagemsg{font-weight:700;color:var(--gold2);font-family:var(--fu);min-height:1.5em}
.probwidget{max-width:520px}
.guarantee{max-width:860px;font-family:var(--fu);font-size:.92rem;border:1px solid var(--line);border-radius:10px;padding:0 12px}

.sgfrange{width:100%;min-height:44px;accent-color:var(--gold)}
.sgfnum{font-family:var(--fu);color:var(--muted)}
.sgfcomment{white-space:pre-wrap;font-family:var(--fu);margin:6px 0}
.sgfroot,.sgfout{max-width:760px}
.warnbox{font-family:var(--fu);font-size:.88rem;color:var(--warn)}
.abs{max-width:820px}.abs p{font-family:var(--fu);font-size:.95rem;white-space:pre-line}
.foot{margin:30px 0 10px;color:var(--muted);font-family:var(--fu);text-align:center}
.ns{padding:16px;background:#400;color:#fff;font-family:system-ui}
@media (max-width:900px){.playgrid{grid-template-columns:1fr}.learngrid{grid-template-columns:1fr}.lessonlist{flex-direction:row;flex-wrap:wrap}.boardcol{max-width:100%}}

dialog.c1a-dlg{box-sizing:border-box;width:min(46rem,calc(100vw - 1.5rem));max-height:calc(100vh - 1.5rem);overflow:auto;padding:0;border:1px solid var(--c1a-line);border-radius:14px;background:var(--c1a-bg);color:var(--c1a-fg);font:inherit;line-height:1.5}

.c1a-dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px 6px;position:sticky;top:0;background:var(--c1a-bg);z-index:2}

.c1a-dlg :focus-visible,.c1a-online :focus-visible,.c1a-scope :focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.c1a-tablist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;border-bottom:1px solid var(--c1a-line);padding-bottom:8px}
.c1a-tab[aria-selected=true]{background:var(--c1a-accent);color:var(--c1a-on-accent);border-color:var(--c1a-accent);font-weight:700}
.c1a-pane[hidden]{display:none}
.c1a-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:.5rem 0}

.c1a-row label{font-weight:600}
.c1a-dlg input[type=text],.c1a-dlg input[type=number],.c1a-dlg select,.c1a-scope input[type=text],.c1a-scope select{font:inherit;min-height:36px;padding:4px 8px;border:1px solid var(--c1a-line);border-radius:7px;background:var(--c1a-field);color:var(--c1a-fg);max-width:100%}

          nc = ncap; cl = nc ? Array.from(capb.subarray(0, nc)) : null;
          /* ko simplu */
          let newKo = -1;
          if (nc === 1) { const l = chain(p); if (l === 1 && gn === 1) newKo = cl[0]; }
          ko = newKo; passes = 0; turn = 3 - c;
        } else { ko = -1; passes = savedPasses + 1; turn = 3 - c; }
        const r = search(depth - 1);
        /* revenire */
        if (!isPass) { turn = c; h1 ^= Z1[p * 3 + c]; h2 ^= Z2[p * 3 + c]; for (let q = 0; q < nc; q++) { h1 ^= Z1[cl[q] * 3 + 3 - c]; h2 ^= Z2[cl[q] * 3 + 3 - c]; } for (let q = 0; q < nc; q++) b[cl[q]] = 3 - c; b[p] = 0; } else { turn = c; }
        ko = savedKo; passes = savedPasses;
        if (isProver && r) { result = true; break; }
        if (!isProver && !r) { result = false; break; }
      }
      if (result) ent.hi = Math.min(ent.hi, depth); else ent.lo = Math.max(ent.lo, depth);
      return result;
    }
    /* testează fiecare mutare legală a lui `turn` (prover) -> lista celor câștigătoare în `depth` */
    function rootMoves() {
      const out = [];
      for (let p = 0; p < N; p++) if (b[p] === 0) out.push(p);
      return out;
    }
    function tryRoot(p, depth) { /* p = -1 pas; returnează true dacă după mutarea lui prover, prover mai forțează scopul în depth-1 */
      const c = turn, savedKo = ko, savedPasses = passes;
      let nc = 0, cl = null;
      if (p >= 0) {
        if (!put(p, c)) return null;
        applyHash(p, c, true);
        nc = ncap; cl = nc ? Array.from(capb.subarray(0, nc)) : null;
        let newKo = -1; if (nc === 1) { const l = chain(p); if (l === 1 && gn === 1) newKo = cl[0]; }
        ko = newKo; passes = 0; turn = 3 - c;
      } else { ko = -1; passes = savedPasses + 1; turn = 3 - c; }
      const r = search(depth - 1);
      if (p >= 0) { turn = c; h1 ^= Z1[p * 3 + c]; h2 ^= Z2[p * 3 + c]; for (let q = 0; q < nc; q++) { h1 ^= Z1[cl[q] * 3 + 3 - c]; h2 ^= Z2[cl[q] * 3 + 3 - c]; } for (let q = 0; q < nc; q++) b[cl[q]] = 3 - c; b[p] = 0; } else turn = c;
      ko = savedKo; passes = savedPasses;
      return r;
    }
    function setState(board, t, k, ps) { b.set(board); turn = t; ko = k; passes = ps; h1 = 0; h2 = 0; for (let i = 0; i < N; i++) if (b[i]) { h1 ^= Z1[i * 3 + b[i]]; h2 ^= Z2[i * 3 + b[i]]; } }
    return { search, tryRoot, rootMoves, setState, evalPos, nodes: () => nodes, TT, get turn() { return turn; }, board: b, nb };
  }

  /* ---------- stare de joc pentru UI ---------- */
  function newGameState(P) { return { b: P.b.slice(), turn: P.prover, ko: -1, passes: 0, moves: [] }; }
  function cloneG(g) { return { b: g.b.slice(), turn: g.turn, ko: g.ko, passes: g.passes, moves: g.moves.slice() }; }
  /* aplică p (sau -1 pas) pe g; returnează null sau motivul */
  function playG(P, g, p) {
    const { N, nb, wall } = P, b = g.b, c = g.turn, o = 3 - c;
    if (p < 0) { g.passes++; g.ko = -1; g.turn = o; g.moves.push([-1, c]); return null; }
    if (b[p] !== 0) return 'occupied';
    if (p === g.ko) return 'ko';
    const mark = new Int8Array(N);
    function chain(q) { const col = b[q]; const pts = [q], seen = new Set([q]); let libs = new Set(), imm = !!wall[q]; for (let i = 0; i < pts.length; i++) for (const r of nb[pts[i]]) { if (b[r] === 0) libs.add(r); else if (b[r] === col && !seen.has(r)) { seen.add(r); pts.push(r); if (wall[r]) imm = true; } } return { pts, libs: libs.size, imm }; }
    b[p] = c; const caps = [];
    for (const q of nb[p]) if (b[q] === o) { const ch = chain(q); if (ch.libs === 0 && !ch.imm) for (const x of ch.pts) if (b[x] === o) { b[x] = 0; caps.push(x); } }
    if (!caps.length) { const ch = chain(p); if (ch.libs === 0 && !ch.imm) { b[p] = 0; return 'suicide'; } }
    void mark;
    let ko = -1; if (caps.length === 1) { const ch = chain(p); if (ch.pts.length === 1 && ch.libs === 1) ko = caps[0]; }
    g.ko = ko; g.passes = 0; g.turn = o; g.moves.push([p, c]); g.caps = (g.caps || 0) + caps.length;
    return null;
  }

  /* ---------- API de nivel înalt ---------- */
  function solverFor(P) { return Solver(P); }
  /* toate mutările câștigătoare ale lui `prover` din poziția g, la adâncimea D (semi-mutări incluzând mutarea) */
  function winningMoves(P, g, D, S) {
    S = S || Solver(P); S.setState(g.b, g.turn, g.ko, g.passes);
    const win = [], lose = [];
    for (let p = 0; p < P.N; p++) { if (g.b[p] !== 0) continue; const r = S.tryRoot(p, D); if (r === null) continue; (r ? win : lose).push(p); }
    return { win, lose, S };
  }
  function minDepth(P, g, maxD, S) { /* cea mai mică adâncime la care prover forțează scopul */
    S = S || Solver(P); S.setState(g.b, g.turn, g.ko, g.passes);
    for (let d = 1; d <= maxD; d++) { if (S.search(d)) return d; }
    return -1;
  }
  /* răspunsul adversarului după mutarea lui prover: apărarea cea mai lungă (dacă prover câștigă) sau o respingere (dacă nu) */
  function bestReply(P, g, D, S) {
    S = S || Solver(P);
    const c = g.turn; const cands = []; for (let p = 0; p < P.N; p++) if (g.b[p] === 0 && p !== g.ko) cands.push(p); cands.push(-1);
    S.setState(g.b, g.turn, g.ko, g.passes);
    if (S.evalPos()) return { move: null, result: S.evalPos() };
    let refute = null, longest = null, longestD = -1;
    for (const p of cands) {
      /* simulează mutarea adversarului (c) și întreabă dacă prover (3-c) mai câștigă în D-1 */
      const g2 = cloneG(g); if (playG(P, g2, p)) continue;
      S.setState(g2.b, g2.turn, g2.ko, g2.passes);
      let win = S.search(D - 1);
      if (!win) { if (!refute) refute = p; continue; }
      let d = 1; for (; d < D; d++) if (S.search(d)) break;
      if (d > longestD) { longestD = d; longest = p; }
    }
    if (refute !== null) return { move: refute, prover: false };
    return { move: longest, prover: true, depth: longestD };
  }
  function terminal(P, g) {
    const S = Solver(P); S.setState(g.b, g.turn, g.ko, g.passes); return S.evalPos();
  }
  /* variația principală: prover joacă mutarea câștigătoare cea mai rapidă, adversarul apărarea cea mai lungă */
  function mainLine(P, D) {
    const g = newGameState(P), S = Solver(P), line = [];
    for (let i = 0; i < D + 2; i++) {
      if (terminal(P, g)) break;
      if (g.turn === P.prover) {
        let best = null, bd = 99;
        S.setState(g.b, g.turn, g.ko, g.passes);
        for (let d = 1; d <= D - i && best === null; d++) for (let p = 0; p < P.N; p++) { if (g.b[p] !== 0) continue; const g2 = cloneG(g); if (playG(P, g2, p)) continue; S.setState(g2.b, g2.turn, g2.ko, g2.passes); if (S.search(d - 1)) { best = p; bd = d; break; } }
        if (best === null) return { line, ok: false };
        playG(P, g, best); line.push([best, P.prover]);
      } else {
        const r = bestReply(P, g, D - i, S); if (r.move === null || r.move === undefined) break;
        playG(P, g, r.move); line.push([r.move, 3 - P.prover]);
      }
    }
    return { line, ok: terminal(P, g) === (P.goal === 'live' ? 2 : 1) };
  }

  return { parse, Solver, newGameState, cloneG, playG, winningMoves, minDepth, bestReply, terminal, mainLine };
}

const XL = {"Default komi: Japanese 6.5 · Chinese 7.5 · AGA 7.5 · Tromp–Taylor 7.5. With h handicap stones: Japanese/TT/custom 0.5 · AGA h−0.5 (i.e. 0.5 + (h−1), the same value) · Chinese h (editable).":["Komi par défaut : japonaises 6,5 · chinoises 7,5 · AGA 7,5 · Tromp–Taylor 7,5. Avec h pierres de handicap : japonaises/TT/personnalisé 0,5 · AGA h−0,5 (soit 0,5 + (h−1), la même valeur) · chinoises h (modifiable).","Komi predefinito: giapponesi 6,5 · cinesi 7,5 · AGA 7,5 · Tromp–Taylor 7,5. Con h pietre di handicap: giapponesi/TT/personalizzato 0,5 · AGA h−0,5 (cioè 0,5 + (h−1), lo stesso valore) · cinesi h (modificabile).","Komi por defecto: japonesas 6,5 · chinas 7,5 · AGA 7,5 · Tromp–Taylor 7,5. Con h piedras de handicap: japonesas/TT/personalizado 0,5 · AGA h−0,5 (es decir, 0,5 + (h−1), el mismo valor) · chinas h (editable).","Komi por omissão: japonesas 6,5 · chinesas 7,5 · AGA 7,5 · Tromp–Taylor 7,5. Com h pedras de handicap: japonesas/TT/personalizado 0,5 · AGA h−0,5 (ou seja, 0,5 + (h−1), o mesmo valor) · chinesas h (editável).","Standard-Komi: japanisch 6,5 · chinesisch 7,5 · AGA 7,5 · Tromp–Taylor 7,5. Mit h Vorgabesteinen: japanisch/TT/benutzerdefiniert 0,5 · AGA h−0,5 (also 0,5 + (h−1), derselbe Wert) · chinesisch h (änderbar).","Alapértelmezett komi: japán 6,5 · kínai 7,5 · AGA 7,5 · Tromp–Taylor 7,5. h előnykővel: japán/TT/egyéni 0,5 · AGA h−0,5 (azaz 0,5 + (h−1), ugyanaz az érték) · kínai h (szerkeszthető)."],"Go (Baduk, Weiqi, Igo)":["Go (Baduk, Weiqi, Igo)","Go (Baduk, Weiqi, Igo)","Go (Baduk, Weiqi, Igo)","Go (Baduk, Weiqi, Igo)","Go (Baduk, Weiqi, Igo)","Go (Baduk, Weiqi, Igo)"],"The territory game of black and white stones on the intersections of a board, here with the rules of your choice.":["Le jeu de territoire de pierres noires et blanches sur les intersections d’un plateau, ici avec les règles de votre choix.","Il gioco del territorio con pietre nere e bianche sulle intersezioni di una tavola, qui con le regole che preferisci.","El juego de territorio con piedras negras y blancas sobre las intersecciones de un tablero, aquí con las reglas que elijas.","O jogo de território com pedras pretas e brancas nas interseções de um tabuleiro, aqui com as regras à tua escolha.","Das Gebietsspiel mit schwarzen und weißen Steinen auf den Schnittpunkten eines Brettes, hier mit den Regeln deiner Wahl.","A fekete és fehér kövekkel játszott területjáték a tábla metszéspontjain, itt a választott szabályokkal."],"Originated in China several millennia ago (Weiqi); played in Korea (Baduk), Japan (Igo) and worldwide. The classic board is 19×19; 9×9 and 13×13 are common for learning.":["Né en Chine il y a plusieurs millénaires (Weiqi) ; pratiqué en Corée (Baduk), au Japon (Igo) et dans le monde entier. Le plateau classique est de 19×19 ; 9×9 et 13×13 sont courants pour l’apprentissage.","Nato in Cina diversi millenni fa (Weiqi); praticato in Corea (Baduk), in Giappone (Igo) e in tutto il mondo. La tavola classica è 19×19; 9×9 e 13×13 sono comuni per imparare.","Nació en China hace varios milenios (Weiqi); se juega en Corea (Baduk), Japón (Igo) y en todo el mundo. El tablero clásico es de 19×19; el 9×9 y el 13×13 son habituales para aprender.","Nasceu na China há vários milénios (Weiqi); joga-se na Coreia (Baduk), no Japão (Igo) e em todo o mundo. O tabuleiro clássico é 19×19; o 9×9 e o 13×13 são comuns para aprender.","Vor mehreren Jahrtausenden in China entstanden (Weiqi); gespielt in Korea (Baduk), Japan (Igo) und weltweit. Das klassische Brett ist 19×19; 9×9 und 13×13 sind zum Lernen üblich.","Kínában keletkezett több ezer évvel ezelőtt (Weiqi); játsszák Koreában (Baduk), Japánban (Igo) és világszerte. A klasszikus tábla 19×19-es; a tanuláshoz a 9×9 és a 13×13 az általános."],"Black and White alternately place a stone on a free intersection. A chain of connected stones lives while it has liberties (adjacent free points). When the last liberty disappears the chain is captured. A move that would repeat an earlier position is forbidden by the chosen ko rule. The game ends when both players pass in succession; the higher score after komi wins.":["Noir et Blanc posent à tour de rôle une pierre sur une intersection libre. Une chaîne de pierres connectées vit tant qu’elle a des libertés (points libres adjacents). Quand la dernière liberté disparaît, la chaîne est capturée. Un coup qui répéterait une position antérieure est interdit par la règle de ko choisie. La partie se termine quand les deux joueurs passent consécutivement ; le score le plus élevé après komi l’emporte.","Nero e Bianco posano a turno una pietra su un’intersezione libera. Una catena di pietre connesse vive finché ha libertà (punti liberi adiacenti). Quando scompare l’ultima libertà, la catena è catturata. Una mossa che ripeterebbe una posizione precedente è vietata dalla regola del ko scelta. La partita finisce quando entrambi passano di seguito; vince il punteggio più alto dopo il komi.","Negro y Blanco colocan por turnos una piedra en una intersección libre. Una cadena de piedras conectadas vive mientras tenga libertades (puntos libres adyacentes). Cuando desaparece la última libertad, la cadena es capturada. Una jugada que repitiera una posición anterior está prohibida por la regla de ko elegida. La partida termina cuando ambos jugadores pasan seguidamente; gana la puntuación más alta tras el komi.","Preto e Branco colocam à vez uma pedra numa interseção livre. Uma cadeia de pedras ligadas vive enquanto tiver liberdades (pontos livres adjacentes). Quando desaparece a última liberdade, a cadeia é capturada. Uma jogada que repetisse uma posição anterior é proibida pela regra de ko escolhida. O jogo termina quando ambos os jogadores passam seguidamente; ganha a pontuação mais alta depois do komi.","Schwarz und Weiß setzen abwechselnd einen Stein auf einen freien Schnittpunkt. Eine Kette verbundener Steine lebt, solange sie Freiheiten hat (angrenzende freie Punkte). Verschwindet die letzte Freiheit, wird die Kette geschlagen. Ein Zug, der eine frühere Stellung wiederholen würde, ist durch die gewählte Ko-Regel verboten. Das Spiel endet, wenn beide nacheinander passen; es gewinnt die höhere Punktzahl nach Komi.","A Fekete és a Fehér felváltva tesz egy követ egy szabad metszéspontra. Az összekapcsolt kövek lánca addig él, amíg vannak szabadságai (szomszédos szabad pontjai). Amikor az utolsó szabadság is eltűnik, a láncot leveszik. Az a lépés, amely egy korábbi állást ismételne meg, tilos a választott ko-szabály szerint. A játék akkor ér véget, ha mindkét játékos egymás után passzol; a komi utáni magasabb pontszám nyer."],"See each ruleset card: differences (scoring, suicide, ko) are documented there.":["Voir chaque fiche de règles : les différences (décompte, suicide, ko) y sont documentées.","Vedi ogni scheda di regolamento: le differenze (conteggio, suicidio, ko) sono documentate lì.","Consulta cada ficha de reglas: allí se documentan las diferencias (recuento, suicidio, ko).","Vê cada ficha de regras: as diferenças (contagem, suicídio, ko) estão documentadas aí.","Siehe die jeweilige Regelkarte: Die Unterschiede (Wertung, Selbstmord, Ko) sind dort dokumentiert.","Lásd az egyes szabálykártyákat: a különbségek (számolás, öngyilkosság, ko) ott vannak dokumentálva."],"Japanese rules (territory)":["Règles japonaises (territoire)","Regole giapponesi (territorio)","Reglas japonesas (territorio)","Regras japonesas (território)","Japanische Regeln (Gebiet)","Japán szabályok (terület)"],"Score = territory + prisoners; points in seki do not count. Komi 6.5.":["Score = territoire + prisonniers ; les points en seki ne comptent pas. Komi 6,5.","Punteggio = territorio + prigionieri; i punti in seki non contano. Komi 6,5.","Puntuación = territorio + prisioneros; los puntos en seki no cuentan. Komi 6,5.","Pontuação = território + prisioneiros; os pontos em seki não contam. Komi 6,5.","Wertung = Gebiet + Gefangene; Punkte im Seki zählen nicht. Komi 6,5.","Pontszám = terület + foglyok; a szekiben lévő pontok nem számítanak. Komi 6,5."],"Codified by the Nihon Ki-in (Japan) and used in Japanese tournaments; the basis of much Western teaching.":["Codifiées par le Nihon Ki-in (Japon) et utilisées dans les tournois japonais ; elles servent de base à une grande partie de l’enseignement occidental.","Codificate dalla Nihon Ki-in (Giappone) e usate nei tornei giapponesi; la base di gran parte dell’insegnamento occidentale.","Codificadas por la Nihon Ki-in (Japón) y usadas en los torneos japoneses; la base de gran parte de la enseñanza occidental.","Codificadas pela Nihon Ki-in (Japão) e usadas nos torneios japoneses; a base de grande parte do ensino ocidental.","Von der Nihon Ki-in (Japan) kodifiziert und bei japanischen Turnieren verwendet; die Grundlage eines großen Teils des westlichen Unterrichts.","A Nihon Ki-in (Japán) kodifikálta, és a japán versenyeken használják; a nyugati oktatás nagy részének alapja."],"A player's score is the number of empty points surrounded only by their stones (territory) plus captured enemy stones, including dead stones left on the board at the end. Suicide is forbidden. Points in seki and dame are neutral. Dead stones are agreed upon before counting.":["Le score d’un joueur est le nombre de points vides entourés uniquement par ses pierres (territoire) plus les pierres ennemies capturées, y compris les pierres mortes laissées sur le plateau à la fin. Le suicide est interdit. Les points en seki et les dame sont neutres. Les pierres mortes sont convenues avant le décompte.","Il punteggio di un giocatore è il numero di punti vuoti circondati solo dalle sue pietre (territorio) più le pietre nemiche catturate, comprese le pietre morte lasciate sulla tavola alla fine. Il suicidio è vietato. I punti in seki e i dame sono neutri. Le pietre morte si concordano prima del conteggio.","La puntuación de un jugador es el número de puntos vacíos rodeados solo por sus piedras (territorio) más las piedras enemigas capturadas, incluidas las piedras muertas que queden en el tablero al final. El suicidio está prohibido. Los puntos en seki y los dame son neutros. Las piedras muertas se acuerdan antes del recuento.","A pontuação de um jogador é o número de pontos vazios rodeados apenas pelas suas pedras (território) mais as pedras inimigas capturadas, incluindo as pedras mortas deixadas no tabuleiro no fim. O suicídio é proibido. Os pontos em seki e os dame são neutros. As pedras mortas são acordadas antes da contagem.","Die Punktzahl einer Person ist die Zahl der leeren Punkte, die nur von ihren Steinen umgeben sind (Gebiet), plus geschlagene gegnerische Steine, einschließlich toter Steine, die am Ende auf dem Brett bleiben. Selbstmord ist verboten. Punkte im Seki und Dame sind neutral. Tote Steine werden vor dem Zählen vereinbart.","A játékos pontszáma a kizárólag az ő köveivel körülvett üres pontok száma (terület) plusz a levett ellenséges kövek, beleértve a végén a táblán maradt halott köveket. Az öngyilkosság tilos. A szekiben lévő pontok és a dame semlegesek. A halott köveket a számolás előtt egyeztetik."],"⚠ Approximations: simple ko only (immediate retake); long cycles (e.g. triple ko) do NOT give \"no result\" but hit a safety cap of 4·n² moves. Seki: only shared-liberty points are recognised (neutral automatically); eyes inside a seki are counted as territory. No referee rules (e.g. filling in own territory).":["⚠ Approximations : ko simple seulement (reprise immédiate) ; les longs cycles (p. ex. triple ko) ne donnent PAS « sans résultat » mais atteignent un plafond de sécurité de 4·n² coups. Seki : seuls les points à libertés communes sont reconnus (neutres automatiquement) ; les yeux à l’intérieur d’un seki sont comptés comme territoire. Pas de règles d’arbitrage (p. ex. remplir son propre territoire).","⚠ Approssimazioni: solo ko semplice (ripresa immediata); i cicli lunghi (ad es. triplo ko) NON danno «nessun risultato» ma raggiungono un limite di sicurezza di 4·n² mosse. Seki: sono riconosciuti solo i punti a libertà comuni (neutri in automatico); gli occhi all’interno di un seki sono contati come territorio. Nessuna regola arbitrale (ad es. riempire il proprio territorio).","⚠ Aproximaciones: solo ko simple (recaptura inmediata); los ciclos largos (p. ej. triple ko) NO dan «sin resultado» sino que alcanzan un tope de seguridad de 4·n² jugadas. Seki: solo se reconocen los puntos de libertades compartidas (neutros automáticamente); los ojos dentro de un seki se cuentan como territorio. Sin reglas de arbitraje (p. ej. rellenar el propio territorio).","⚠ Aproximações: apenas ko simples (recaptura imediata); os ciclos longos (p. ex. triplo ko) NÃO dão «sem resultado» mas atingem um limite de segurança de 4·n² jogadas. Seki: só são reconhecidos os pontos de liberdades partilhadas (neutros automaticamente); os olhos dentro de um seki são contados como território. Sem regras de arbitragem (p. ex. preencher o próprio território).","⚠ Näherungen: nur einfaches Ko (sofortiges Zurückschlagen); lange Zyklen (z. B. Dreifach-Ko) ergeben NICHT „kein Ergebnis“, sondern stoßen an eine Sicherheitsgrenze von 4·n² Zügen. Seki: Nur Punkte mit gemeinsamen Freiheiten werden erkannt (automatisch neutral); Augen innerhalb eines Seki werden als Gebiet gezählt. Keine Schiedsrichterregeln (z. B. Auffüllen des eigenen Gebiets).","⚠ Közelítések: csak egyszerű ko (azonnali visszaütés); a hosszú ciklusok (pl. hármas ko) NEM adnak „nincs eredmény”-t, hanem elérik a 4·n² lépéses biztonsági korlátot. Seki: csak a közös szabadságú pontokat ismeri fel (automatikusan semlegesek); a seki belsejében lévő szemeket területnek számítja. Nincsenek játékvezetői szabályok (pl. a saját terület feltöltése)."],"Chinese rules (area)":["Règles chinoises (surface)","Regole cinesi (area)","Reglas chinas (área)","Regras chinesas (área)","Chinesische Regeln (Fläche)","Kínai szabályok (felület)"],"Score = stones on the board + territory. Komi 7.5. No penalty for moves inside your own territory.":["Score = pierres sur le plateau + territoire. Komi 7,5. Aucune pénalité pour les coups joués dans son propre territoire.","Punteggio = pietre sulla tavola + territorio. Komi 7,5. Nessuna penalità per le mosse dentro il proprio territorio.","Puntuación = piedras en el tablero + territorio. Komi 7,5. Sin penalización por las jugadas dentro del propio territorio.","Pontuação = pedras no tabuleiro + território. Komi 7,5. Sem penalização pelas jogadas dentro do próprio território.","Wertung = Steine auf dem Brett + Gebiet. Komi 7,5. Keine Strafe für Züge im eigenen Gebiet.","Pontszám = kövek a táblán + terület. Komi 7,5. Nincs büntetés a saját területen belüli lépésekért."],"Rules of the Chinese Weiqi Association; area counting also inspired the AGA and Tromp–Taylor rules.":["Règles de l’Association chinoise de Weiqi ; le décompte par surface a aussi inspiré les règles AGA et Tromp–Taylor.","Regole dell’Associazione cinese di Weiqi; il conteggio per area ha ispirato anche le regole AGA e Tromp–Taylor.","Reglas de la Asociación China de Weiqi; el recuento por área inspiró también las reglas AGA y Tromp–Taylor.","Regras da Associação Chinesa de Weiqi; a contagem por área inspirou também as regras AGA e Tromp–Taylor.","Regeln des Chinesischen Weiqi-Verbands; die Flächenzählung hat auch die AGA- und Tromp–Taylor-Regeln inspiriert.","A Kínai Weiqi Szövetség szabályai; a felületszámolás az AGA és a Tromp–Taylor szabályokat is inspirálta."],"Score = number of live stones on the board + empty points surrounded by only one player. Suicide is forbidden. Repeating a whole-board position is forbidden (here: positional superko).":["Score = nombre de pierres vivantes sur le plateau + points vides entourés par un seul joueur. Le suicide est interdit. Répéter une position de tout le plateau est interdit (ici : superko positionnel).","Punteggio = numero di pietre vive sulla tavola + punti vuoti circondati da un solo giocatore. Il suicidio è vietato. Ripetere una posizione dell’intera tavola è vietato (qui: superko posizionale).","Puntuación = número de piedras vivas en el tablero + puntos vacíos rodeados por un solo jugador. El suicidio está prohibido. Repetir una posición de todo el tablero está prohibido (aquí: superko posicional).","Pontuação = número de pedras vivas no tabuleiro + pontos vazios rodeados por um só jogador. O suicídio é proibido. Repetir uma posição de todo o tabuleiro é proibido (aqui: superko posicional).","Wertung = Zahl der lebenden Steine auf dem Brett + leere Punkte, die nur von einer Person umgeben sind. Selbstmord ist verboten. Die Wiederholung einer Ganzbrettstellung ist verboten (hier: positioneller Superko).","Pontszám = az élő kövek száma a táblán + az egyetlen játékos által körülvett üres pontok. Az öngyilkosság tilos. A teljes tábla állásának megismétlése tilos (itt: pozicionális superko)."],"⚠ Approximation: the official repetition rule has extra details; positional superko is used here. Komi 7.5 is the modern usual value, not the 1988 one (7).":["⚠ Approximation : la règle officielle de répétition comporte des détails supplémentaires ; le superko positionnel est utilisé ici. Le komi de 7,5 est la valeur moderne habituelle, pas celle de 1988 (7).","⚠ Approssimazione: la regola ufficiale sulla ripetizione ha dettagli aggiuntivi; qui si usa il superko posizionale. Il komi 7,5 è il valore moderno abituale, non quello del 1988 (7).","⚠ Aproximación: la regla oficial de repetición tiene detalles adicionales; aquí se usa el superko posicional. El komi 7,5 es el valor moderno habitual, no el de 1988 (7).","⚠ Aproximação: a regra oficial de repetição tem pormenores adicionais; aqui usa-se o superko posicional. O komi 7,5 é o valor moderno habitual, não o de 1988 (7).","⚠ Näherung: Die offizielle Wiederholungsregel hat zusätzliche Einzelheiten; hier wird der positionelle Superko verwendet. Komi 7,5 ist der heute übliche Wert, nicht der von 1988 (7).","⚠ Közelítés: a hivatalos ismétlési szabálynak további részletei vannak; itt a pozicionális superkót használjuk. A 7,5-ös komi a mai szokásos érték, nem az 1988-as (7)."],"AGA rules (area with pass stones)":["Règles AGA (surface avec pierres de passe)","Regole AGA (area con pietre di passo)","Reglas AGA (área con piedras de pase)","Regras AGA (área com pedras de passe)","AGA-Regeln (Fläche mit Passsteinen)","AGA szabályok (felület passzkövekkel)"],"Area scoring; every pass hands a stone to the opponent and White moves last, so territory and area scoring give the same difference.":["Décompte par surface ; chaque passe donne une pierre à l’adversaire et Blanc joue en dernier, de sorte que le décompte par territoire et par surface donnent la même différence.","Conteggio per area; ogni passo consegna una pietra all’avversario e Bianco muove per ultimo, così il conteggio per territorio e quello per area danno la stessa differenza.","Recuento por área; cada pase entrega una piedra al oponente y Blanco juega el último, de modo que el recuento por territorio y por área dan la misma diferencia.","Contagem por área; cada passe entrega uma pedra ao adversário e o Branco joga em último, de modo que a contagem por território e por área dão a mesma diferença.","Flächenzählung; jedes Passen gibt dem Gegner einen Stein, und Weiß zieht zuletzt, sodass Gebiets- und Flächenzählung dieselbe Differenz ergeben.","Felületszámolás; minden passz egy követ ad az ellenfélnek, és a Fehér lép utolsóként, így a területszámolás és a felületszámolás ugyanazt a különbséget adja."],"American Go Association; also used internationally in Western tournaments.":["American Go Association ; également utilisées à l’international dans les tournois occidentaux.","American Go Association; usate anche a livello internazionale nei tornei occidentali.","American Go Association; también usadas a nivel internacional en torneos occidentales.","American Go Association; também usadas a nível internacional em torneios ocidentais.","American Go Association; auch international bei westlichen Turnieren verwendet.","American Go Association; nemzetközileg is használják nyugati versenyeken."],"Area + komi 7.5. A player who passes gives a pass stone to the opponent (in TERRITORY counting it is a prisoner; in AREA counting prisoners and pass stones are ignored, and the equal result is guaranteed by the rule \"the total number of stones played or passed by the two players must be equal\"). The game ends after two consecutive passes provided White passed last: if Black passes after White, White must pass once more. Repeating an earlier position is forbidden (here: situational superko — position plus player to move). With h handicap stones: komi 0.5 + (h−1).":["Surface + komi 7,5. Un joueur qui passe donne une pierre de passe à l’adversaire (au décompte par TERRITOIRE c’est un prisonnier ; au décompte par SURFACE, prisonniers et pierres de passe sont ignorés, et l’égalité du résultat est garantie par la règle « le nombre total de pierres jouées ou passées par les deux joueurs doit être égal »). La partie se termine après deux passes consécutives, à condition que Blanc ait passé en dernier : si Noir passe après Blanc, Blanc doit passer une fois de plus. Répéter une position antérieure est interdit (ici : superko situationnel — position plus joueur au trait). Avec h pierres de handicap : komi 0,5 + (h−1).","Area + komi 7,5. Un giocatore che passa dà una pietra di passo all’avversario (nel conteggio per TERRITORIO è un prigioniero; nel conteggio per AREA prigionieri e pietre di passo sono ignorati, e l’uguaglianza del risultato è garantita dalla regola «il numero totale di pietre giocate o passate dai due giocatori deve essere uguale»). La partita finisce dopo due passi consecutivi, purché Bianco abbia passato per ultimo: se Nero passa dopo Bianco, Bianco deve passare ancora una volta. Ripetere una posizione precedente è vietato (qui: superko situazionale — posizione più giocatore di turno). Con h pietre di handicap: komi 0,5 + (h−1).","Área + komi 7,5. Un jugador que pasa da una piedra de pase al oponente (en el recuento por TERRITORIO es un prisionero; en el recuento por ÁREA se ignoran prisioneros y piedras de pase, y la igualdad del resultado está garantizada por la regla «el número total de piedras jugadas o pasadas por los dos jugadores debe ser igual»). La partida termina tras dos pases consecutivos siempre que Blanco haya pasado el último: si Negro pasa después de Blanco, Blanco debe pasar una vez más. Repetir una posición anterior está prohibido (aquí: superko situacional — posición más jugador al turno). Con h piedras de handicap: komi 0,5 + (h−1).","Área + komi 7,5. Um jogador que passa dá uma pedra de passe ao adversário (na contagem por TERRITÓRIO é um prisioneiro; na contagem por ÁREA ignoram-se prisioneiros e pedras de passe, e a igualdade do resultado é garantida pela regra «o número total de pedras jogadas ou passadas pelos dois jogadores tem de ser igual»). O jogo termina após dois passes consecutivos, desde que o Branco tenha passado em último: se o Preto passa depois do Branco, o Branco tem de passar mais uma vez. Repetir uma posição anterior é proibido (aqui: superko situacional — posição mais jogador a jogar). Com h pedras de handicap: komi 0,5 + (h−1).","Fläche + Komi 7,5. Wer passt, gibt dem Gegner einen Passstein (bei GEBIETSzählung ist er ein Gefangener; bei FLÄCHENzählung werden Gefangene und Passsteine ignoriert, und das gleiche Ergebnis ist durch die Regel „die Gesamtzahl der von beiden gesetzten oder gepassten Steine muss gleich sein“ gesichert). Das Spiel endet nach zwei aufeinanderfolgenden Pässen, sofern Weiß zuletzt gepasst hat: Passt Schwarz nach Weiß, muss Weiß noch einmal passen. Die Wiederholung einer früheren Stellung ist verboten (hier: situativer Superko — Stellung plus Spieler am Zug). Mit h Vorgabesteinen: Komi 0,5 + (h−1).","Felület + komi 7,5. Aki passzol, passzkövet ad az ellenfélnek (TERÜLETszámolásnál ez fogoly; FELÜLETszámolásnál a foglyokat és a passzköveket figyelmen kívül hagyják, és az egyenlő eredményt az a szabály biztosítja, hogy „a két játékos által lerakott vagy passzolt kövek összes számának egyenlőnek kell lennie”). A játék két egymást követő passz után ér véget, feltéve, hogy a Fehér passzolt utoljára: ha a Fekete a Fehér után passzol, a Fehérnek még egyszer passzolnia kell. Egy korábbi állás megismétlése tilos (itt: szituációs superko — állás plusz a soron lévő játékos). h előnykővel: komi 0,5 + (h−1)."],"⚠ Checked at audit against the AGA text (1991, hosted by the British Go Association) and Wikipedia \"Rules of Go\": pass stones are NOT added to the area score (bug fixed). The AGA text says \"board position\" without specifying positional/situational; situational is used here. Refereeing and disputed-marking rules are not included.":["⚠ Vérifié lors de l’audit d’après le texte AGA (1991, hébergé par la British Go Association) et Wikipédia « Rules of Go » : les pierres de passe ne sont PAS ajoutées au score par surface (bogue corrigé). Le texte AGA dit « board position » sans préciser positionnel/situationnel ; le situationnel est utilisé ici. Les règles d’arbitrage et de marquage contesté ne sont pas incluses.","⚠ Verificato in fase di audit sul testo AGA (1991, ospitato dalla British Go Association) e su Wikipedia «Rules of Go»: le pietre di passo NON si aggiungono al punteggio per area (bug corretto). Il testo AGA dice «board position» senza specificare posizionale/situazionale; qui si usa quello situazionale. Le regole di arbitraggio e di marcatura contestata non sono incluse.","⚠ Comprobado en la auditoría con el texto de la AGA (1991, alojado por la British Go Association) y Wikipedia «Rules of Go»: las piedras de pase NO se suman a la puntuación por área (error corregido). El texto de la AGA dice «board position» sin precisar posicional/situacional; aquí se usa la situacional. No se incluyen las reglas de arbitraje ni de marcado disputado.","⚠ Verificado na auditoria com o texto da AGA (1991, alojado pela British Go Association) e a Wikipédia «Rules of Go»: as pedras de passe NÃO se somam à pontuação por área (erro corrigido). O texto da AGA diz «board position» sem especificar posicional/situacional; aqui usa-se a situacional. As regras de arbitragem e de marcação disputada não estão incluídas.","⚠ Beim Audit am AGA-Text (1991, gehostet von der British Go Association) und an Wikipedia „Rules of Go“ geprüft: Passsteine werden NICHT zur Flächenwertung addiert (Fehler behoben). Der AGA-Text sagt „board position“, ohne positionell/situativ festzulegen; hier wird situativ verwendet. Schiedsrichter- und Streitfall-Markierungsregeln sind nicht enthalten.","⚠ Az auditon ellenőrizve az AGA szövegével (1991, a British Go Association tárolja) és a Wikipedia „Rules of Go” cikkével: a passzkövek NEM adódnak hozzá a felületpontszámhoz (hiba javítva). Az AGA szövege „board position”-t mond, anélkül hogy pozicionálist/szituációsat jelölne; itt a szituációsat használjuk. A játékvezetői és vitatott jelölési szabályok nincsenek benne."],"Tromp–Taylor (formal, automatic score)":["Tromp–Taylor (formelles, score automatique)","Tromp–Taylor (formali, punteggio automatico)","Tromp–Taylor (formales, puntuación automática)","Tromp–Taylor (formais, pontuação automática)","Tromp–Taylor (formal, automatische Wertung)","Tromp–Taylor (formális, automatikus pontozás)"],"Purely formal rules, easy to program: no dead-stone marking — what is on the board is counted as it stands.":["Règles purement formelles, faciles à programmer : pas de marquage des pierres mortes — ce qui se trouve sur le plateau est compté tel quel.","Regole puramente formali, facili da programmare: nessuna marcatura delle pietre morte — ciò che sta sulla tavola si conta così com’è.","Reglas puramente formales, fáciles de programar: sin marcar piedras muertas — lo que hay en el tablero se cuenta tal como está.","Regras puramente formais, fáceis de programar: sem marcação de pedras mortas — o que está no tabuleiro conta-se tal como está.","Rein formale Regeln, leicht zu programmieren: keine Markierung toter Steine — was auf dem Brett liegt, wird so gezählt, wie es ist.","Tisztán formális, könnyen programozható szabályok: nincs halott kövek jelölése — ami a táblán van, azt úgy számolják, ahogy áll."],"Formulated by John Tromp and Bill Taylor as a precise mathematical definition of the game, used by many engines.":["Formulées par John Tromp et Bill Taylor comme définition mathématique précise du jeu, utilisées par de nombreux moteurs.","Formulate da John Tromp e Bill Taylor come definizione matematica precisa del gioco, usate da molti motori.","Formuladas por John Tromp y Bill Taylor como definición matemática precisa del juego, usadas por muchos motores.","Formuladas por John Tromp e Bill Taylor como definição matemática precisa do jogo, usadas por muitos motores.","Von John Tromp und Bill Taylor als präzise mathematische Definition des Spiels formuliert, von vielen Engines verwendet.","John Tromp és Bill Taylor fogalmazta meg a játék pontos matematikai meghatározásaként, sok motor használja."],"Scoring by \"reaching\": an empty point belongs to a player if it touches only their stones. Suicide is allowed (own chain is removed after enemy captures). Repeating any earlier position is forbidden (positional superko) — so single-stone suicide, which would recreate the position, is illegal. Dead stones are not marked: capture them on the board before passing.":["Décompte par « atteinte » : un point vide appartient à un joueur s’il ne touche que ses pierres. Le suicide est autorisé (sa propre chaîne est retirée après les captures ennemies). Répéter n’importe quelle position antérieure est interdit (superko positionnel) — donc le suicide d’une seule pierre, qui recréerait la position, est illégal. Les pierres mortes ne sont pas marquées : capturez-les sur le plateau avant de passer.","Conteggio per «raggiungimento»: un punto vuoto appartiene a un giocatore se tocca solo le sue pietre. Il suicidio è permesso (la propria catena viene rimossa dopo le catture nemiche). Ripetere qualsiasi posizione precedente è vietato (superko posizionale) — quindi il suicidio di una singola pietra, che ricreerebbe la posizione, è illegale. Le pietre morte non si marcano: catturale sulla tavola prima di passare.","Recuento por «alcance»: un punto vacío pertenece a un jugador si solo toca sus piedras. El suicidio está permitido (la propia cadena se retira tras las capturas enemigas). Repetir cualquier posición anterior está prohibido (superko posicional), así que el suicidio de una sola piedra, que recrearía la posición, es ilegal. Las piedras muertas no se marcan: captúralas en el tablero antes de pasar.","Contagem por «alcance»: um ponto vazio pertence a um jogador se tocar apenas nas suas pedras. O suicídio é permitido (a própria cadeia é retirada depois das capturas inimigas). Repetir qualquer posição anterior é proibido (superko posicional) — pelo que o suicídio de uma só pedra, que recriaria a posição, é ilegal. As pedras mortas não se marcam: captura-as no tabuleiro antes de passar.","Wertung durch „Erreichen“: Ein leerer Punkt gehört einer Person, wenn er nur ihre Steine berührt. Selbstmord ist erlaubt (die eigene Kette wird nach gegnerischen Schlägen entfernt). Die Wiederholung jeder früheren Stellung ist verboten (positioneller Superko) — daher ist der Ein-Stein-Selbstmord, der die Stellung wiederherstellen würde, illegal. Tote Steine werden nicht markiert: Schlage sie auf dem Brett, bevor du passt.","Számolás „elérés” alapján: egy üres pont az adott játékosé, ha csak az ő köveit érinti. Az öngyilkosság megengedett (a saját láncot az ellenséges levételek után eltávolítják). Bármely korábbi állás megismétlése tilos (pozicionális superko) — így az egykő-öngyilkosság, amely újra létrehozná az állást, szabálytalan. A halott köveket nem jelölik: vedd le őket a táblán, mielőtt passzolsz."],"Faithful to the rules cited. Komi is not part of the 8 rules; 7.5 is the typical choice.":["Fidèle aux règles citées. Le komi ne fait pas partie des 8 règles ; 7,5 est le choix typique.","Fedele alle regole citate. Il komi non fa parte delle 8 regole; 7,5 è la scelta tipica.","Fiel a las reglas citadas. El komi no forma parte de las 8 reglas; 7,5 es la elección típica.","Fiel às regras citadas. O komi não faz parte das 8 regras; 7,5 é a escolha típica.","Den zitierten Regeln treu. Komi ist nicht Teil der 8 Regeln; 7,5 ist die typische Wahl.","Hű az idézett szabályokhoz. A komi nem része a 8 szabálynak; a 7,5 a tipikus választás."],"Small-board Go (5×5, 7×7)":["Go sur petit plateau (5×5, 7×7)","Go su tavola piccola (5×5, 7×7)","Go en tablero pequeño (5×5, 7×7)","Go em tabuleiro pequeno (5×5, 7×7)","Go auf kleinem Brett (5×5, 7×7)","Go kis táblán (5×5, 7×7)"],"Quick games to learn capture, eyes and local tactics.":["Parties rapides pour apprendre la capture, les yeux et la tactique locale.","Partite veloci per imparare cattura, occhi e tattica locale.","Partidas rápidas para aprender captura, ojos y táctica local.","Partidas rápidas para aprender captura, olhos e tática local.","Schnelle Partien, um Schlagen, Augen und lokale Taktik zu lernen.","Gyors játszmák a levétel, a szemek és a helyi taktika megtanulásához."],"Small boards are a classic teaching tool; 5×5 is computationally solved and 7×7 has a result reported in the literature.":["Les petits plateaux sont un outil pédagogique classique ; le 5×5 est résolu par calcul et le 7×7 a un résultat rapporté dans la littérature.","Le tavole piccole sono uno strumento didattico classico; il 5×5 è risolto computazionalmente e il 7×7 ha un risultato riportato in letteratura.","Los tableros pequeños son una herramienta didáctica clásica; el 5×5 está resuelto computacionalmente y el 7×7 tiene un resultado recogido en la literatura.","Os tabuleiros pequenos são uma ferramenta didática clássica; o 5×5 está resolvido computacionalmente e o 7×7 tem um resultado referido na literatura.","Kleine Bretter sind ein klassisches Lehrmittel; 5×5 ist rechnerisch gelöst, und für 7×7 wird in der Literatur ein Ergebnis berichtet.","A kis táblák klasszikus oktatási eszközök; az 5×5 számítással megoldott, a 7×7-hez pedig az irodalom közöl eredményt."],"Same rules as classic Go. The literature reports that on 5×5 Black wins by 25 points with perfect play (area), and on 7×7 komi 9 is considered \"fair\". These figures are quoted from the literature and were NOT verified by me here; for play, default komi is 0.5 on 5×5.":["Mêmes règles que le Go classique. La littérature rapporte qu’au 5×5 Noir gagne de 25 points avec un jeu parfait (surface), et qu’au 7×7 un komi de 9 est considéré comme « équitable ». Ces chiffres sont cités d’après la littérature et n’ont PAS été vérifiés ici par moi ; pour jouer, le komi par défaut est de 0,5 au 5×5.","Stesse regole del Go classico. La letteratura riporta che sul 5×5 Nero vince di 25 punti con gioco perfetto (area), e che sul 7×7 un komi di 9 è considerato «equo». Queste cifre sono citate dalla letteratura e NON sono state verificate da me qui; per giocare, il komi predefinito è 0,5 sul 5×5.","Mismas reglas que el Go clásico. La literatura indica que en 5×5 Negro gana por 25 puntos con juego perfecto (área), y que en 7×7 un komi de 9 se considera «justo». Estas cifras se citan de la literatura y NO las he verificado aquí; para jugar, el komi por defecto es 0,5 en 5×5.","Mesmas regras do Go clássico. A literatura refere que em 5×5 o Preto ganha por 25 pontos com jogo perfeito (área), e que em 7×7 um komi de 9 é considerado «justo». Estes valores são citados da literatura e NÃO foram verificados por mim aqui; para jogar, o komi por omissão é 0,5 em 5×5.","Dieselben Regeln wie beim klassischen Go. Die Literatur berichtet, dass auf 5×5 Schwarz bei perfektem Spiel mit 25 Punkten gewinnt (Fläche) und dass auf 7×7 ein Komi von 9 als „fair“ gilt. Diese Zahlen sind aus der Literatur zitiert und wurden von mir hier NICHT überprüft; zum Spielen ist das Standard-Komi auf 5×5 0,5.","Ugyanazok a szabályok, mint a klasszikus Gónál. Az irodalom szerint 5×5-ön a Fekete tökéletes játékkal 25 ponttal nyer (felület), 7×7-en pedig a 9-es komit tartják „méltányosnak”. Ezeket az adatokat az irodalomból idézzük, és én NEM ellenőriztem őket itt; játékhoz az alapértelmezett komi 5×5-ön 0,5."],"The AI is weak in absolute terms (light MCTS) but holds up against beginners on 5×5.":["L’IA est faible en termes absolus (MCTS léger) mais tient face aux débutants au 5×5.","L’IA è debole in termini assoluti (MCTS leggero) ma regge contro i principianti sul 5×5.","La IA es débil en términos absolutos (MCTS ligero) pero aguanta frente a principiantes en 5×5.","A IA é fraca em termos absolutos (MCTS leve) mas aguenta-se contra principiantes em 5×5.","Die KI ist absolut gesehen schwach (leichtes MCTS), hält aber auf 5×5 gegen Anfänger stand.","Az MI abszolút értelemben gyenge (könnyű MCTS), de 5×5-ön kezdők ellen megállja a helyét."],"Handicap Go (2–9 stones)":["Go avec handicap (2–9 pierres)","Go con handicap (2–9 pietre)","Go con handicap (2–9 piedras)","Go com handicap (2–9 pedras)","Vorgabe-Go (2–9 Steine)","Go előnykővel (2–9 kő)"],"The weaker player takes Black with advance stones on the standard star points (hoshi).":["Le joueur le plus faible prend Noir avec des pierres d’avance sur les points d’étoile standard (hoshi).","Il giocatore più debole prende Nero con pietre di vantaggio sui punti stella standard (hoshi).","El jugador más débil toma Negro con piedras de ventaja en los puntos estrella estándar (hoshi).","O jogador mais fraco fica com o Preto, com pedras de avanço nos pontos estrela padrão (hoshi).","Die schwächere Person nimmt Schwarz mit Vorgabesteinen auf den üblichen Sternpunkten (Hoshi).","A gyengébb játékos kapja a Feketét, előnykövekkel a szabványos csillagpontokon (hoshi)."],"Traditional system for balancing players of different strength.":["Système traditionnel pour équilibrer des joueurs de forces différentes.","Sistema tradizionale per bilanciare giocatori di forza diversa.","Sistema tradicional para equilibrar jugadores de distinta fuerza.","Sistema tradicional para equilibrar jogadores de forças diferentes.","Traditionelles System, um Spielende unterschiedlicher Stärke auszugleichen.","Hagyományos rendszer a különböző erejű játékosok kiegyenlítésére."],"Black places h stones on standard points (9/13/19), then White moves first. Positions: 2 = opposite corners; 3–4 = corners; 5 = + centre; 6–9 add side points and centre (19×19 follows tradition; on 9×9 and 13×13 the positions are extrapolated from 19×19 — large handicaps on 9×9 are impractical). Handicap komi: Japanese/TT 0.5; AGA 0.5 + (h−1); Chinese h points.":["Noir pose h pierres sur les points standard (9/13/19), puis Blanc joue en premier. Positions : 2 = coins opposés ; 3–4 = coins ; 5 = + centre ; 6–9 ajoutent des points de côté et le centre (le 19×19 suit la tradition ; aux 9×9 et 13×13 les positions sont extrapolées du 19×19 — de gros handicaps au 9×9 sont peu praticables). Komi de handicap : japonaises/TT 0,5 ; AGA 0,5 + (h−1) ; chinoises h points.","Nero posa h pietre sui punti standard (9/13/19), poi muove per primo Bianco. Posizioni: 2 = angoli opposti; 3–4 = angoli; 5 = + centro; 6–9 aggiungono punti laterali e centro (il 19×19 segue la tradizione; sul 9×9 e sul 13×13 le posizioni sono estrapolate dal 19×19 — grandi handicap sul 9×9 sono impraticabili). Komi di handicap: giapponesi/TT 0,5; AGA 0,5 + (h−1); cinesi h punti.","Negro coloca h piedras en los puntos estándar (9/13/19) y luego Blanco juega primero. Posiciones: 2 = esquinas opuestas; 3–4 = esquinas; 5 = + centro; 6–9 añaden puntos laterales y el centro (el 19×19 sigue la tradición; en 9×9 y 13×13 las posiciones se extrapolan del 19×19 — los handicaps grandes en 9×9 no son prácticos). Komi de handicap: japonesas/TT 0,5; AGA 0,5 + (h−1); chinas h puntos.","O Preto coloca h pedras nos pontos padrão (9/13/19) e depois o Branco joga primeiro. Posições: 2 = cantos opostos; 3–4 = cantos; 5 = + centro; 6–9 acrescentam pontos laterais e o centro (o 19×19 segue a tradição; em 9×9 e 13×13 as posições são extrapoladas do 19×19 — handicaps grandes em 9×9 são impraticáveis). Komi de handicap: japonesas/TT 0,5; AGA 0,5 + (h−1); chinesas h pontos.","Schwarz setzt h Steine auf Standardpunkte (9/13/19), danach zieht Weiß zuerst. Positionen: 2 = gegenüberliegende Ecken; 3–4 = Ecken; 5 = + Mitte; 6–9 ergänzen Seitenpunkte und die Mitte (19×19 folgt der Tradition; auf 9×9 und 13×13 sind die Positionen von 19×19 hochgerechnet — große Vorgaben auf 9×9 sind unpraktisch). Vorgabe-Komi: japanisch/TT 0,5; AGA 0,5 + (h−1); chinesisch h Punkte.","A Fekete h követ tesz a szabványos pontokra (9/13/19), majd a Fehér lép először. Elhelyezések: 2 = szemközti sarkok; 3–4 = sarkok; 5 = + közép; 6–9 oldalpontokat és a középet adja hozzá (a 19×19 a hagyományt követi; 9×9-en és 13×13-on az elhelyezéseket a 19×19-ből extrapoláltuk — nagy előny 9×9-en nem praktikus). Előny-komi: japán/TT 0,5; AGA 0,5 + (h−1); kínai h pont."],"Handicap compensation (checked at audit, Wikipedia \"Rules of Go\"/AGA 1991): Japanese none (here 0.5 to avoid ties), AGA 0.5 + (h−1), Chinese h; values are editable.":["Compensation du handicap (vérifiée lors de l’audit, Wikipédia « Rules of Go »/AGA 1991) : japonaises aucune (ici 0,5 pour éviter les égalités), AGA 0,5 + (h−1), chinoises h ; les valeurs sont modifiables.","Compensazione dell’handicap (verificata in fase di audit, Wikipedia «Rules of Go»/AGA 1991): giapponesi nessuna (qui 0,5 per evitare i pareggi), AGA 0,5 + (h−1), cinesi h; i valori sono modificabili.","Compensación del handicap (comprobada en la auditoría, Wikipedia «Rules of Go»/AGA 1991): japonesas ninguna (aquí 0,5 para evitar empates), AGA 0,5 + (h−1), chinas h; los valores son editables.","Compensação do handicap (verificada na auditoria, Wikipédia «Rules of Go»/AGA 1991): japonesas nenhuma (aqui 0,5 para evitar empates), AGA 0,5 + (h−1), chinesas h; os valores são editáveis.","Vorgabeausgleich (beim Audit geprüft, Wikipedia „Rules of Go“/AGA 1991): japanisch keiner (hier 0,5, um Unentschieden zu vermeiden), AGA 0,5 + (h−1), chinesisch h; die Werte sind änderbar.","Az előny kompenzációja (az auditon ellenőrizve, Wikipedia „Rules of Go”/AGA 1991): japán nincs (itt 0,5, a döntetlenek elkerülésére), AGA 0,5 + (h−1), kínai h; az értékek szerkeszthetők."],"Atari Go / Capture Go / Ponnuki-Go":["Atari Go / Capture Go / Ponnuki-Go","Atari Go / Capture Go / Ponnuki-Go","Atari Go / Capture Go / Ponnuki-Go","Atari Go / Capture Go / Ponnuki-Go","Atari Go / Capture Go / Ponnuki-Go","Atari Go / Capture Go / Ponnuki-Go"],"First capture wins":["Première capture gagnante","Vince la prima cattura","Gana la primera captura","Ganha a primeira captura","Der erste Schlag gewinnt","Az első levétel nyer"],"The first to capture a stone (or 5/10) wins. The best introduction to Go.":["Le premier à capturer une pierre (ou 5/10) gagne. La meilleure introduction au Go.","Vince chi per primo cattura una pietra (oppure 5/10). La migliore introduzione al Go.","Gana quien primero capture una piedra (o 5/10). La mejor introducción al Go.","Ganha quem primeiro capturar uma pedra (ou 5/10). A melhor introdução ao Go.","Wer zuerst einen Stein (oder 5/10) schlägt, gewinnt. Die beste Einführung ins Go.","Aki először levesz egy követ (vagy 5/10-et), nyer. A Go legjobb bevezetője."],"Popular teaching game in Go schools; also called Ponnuki-Go (after the \"ponnuki\" capturing shape) or Capture Go.":["Jeu d’apprentissage populaire dans les écoles de Go ; appelé aussi Ponnuki-Go (d’après la forme de capture « ponnuki ») ou Capture Go.","Gioco didattico popolare nelle scuole di Go; chiamato anche Ponnuki-Go (dalla forma di cattura «ponnuki») o Capture Go.","Juego didáctico popular en las escuelas de Go; también llamado Ponnuki-Go (por la forma de captura «ponnuki») o Capture Go.","Jogo didático popular nas escolas de Go; também chamado Ponnuki-Go (pela forma de captura «ponnuki») ou Capture Go.","Beliebtes Lernspiel in Go-Schulen; auch Ponnuki-Go (nach der Schlagform „Ponnuki“) oder Capture Go genannt.","Népszerű oktatójáték a Go-iskolákban; Ponnuki-Gónak (a „ponnuki” levételi forma után) vagy Capture Gónak is hívják."],"Usually starts with four crossed stones in the centre. Black moves first. The first to capture wins (configurable here: 1, 5 or 10 stones). Suicide is forbidden. If both pass without a capture, it is a draw.":["Commence généralement avec quatre pierres croisées au centre. Noir joue en premier. Le premier à capturer gagne (configurable ici : 1, 5 ou 10 pierres). Le suicide est interdit. Si les deux passent sans capture, c’est une partie nulle.","Di solito inizia con quattro pietre incrociate al centro. Nero muove per primo. Vince chi cattura per primo (configurabile qui: 1, 5 o 10 pietre). Il suicidio è vietato. Se entrambi passano senza catture, è un pareggio.","Suele empezar con cuatro piedras cruzadas en el centro. Negro juega primero. Gana quien capture primero (configurable aquí: 1, 5 o 10 piedras). El suicidio está prohibido. Si ambos pasan sin captura, es tablas.","Costuma começar com quatro pedras cruzadas no centro. O Preto joga primeiro. Ganha quem capturar primeiro (configurável aqui: 1, 5 ou 10 pedras). O suicídio é proibido. Se ambos passam sem captura, é empate.","Beginnt meist mit vier gekreuzten Steinen in der Mitte. Schwarz zieht zuerst. Wer zuerst schlägt, gewinnt (hier einstellbar: 1, 5 oder 10 Steine). Selbstmord ist verboten. Passen beide ohne Schlag, ist es ein Unentschieden.","Általában négy keresztbe rakott kővel indul középen. A Fekete lép először. Aki először levesz, nyer (itt beállítható: 1, 5 vagy 10 kő). Az öngyilkosság tilos. Ha mindketten levétel nélkül passzolnak, döntetlen."],"The cross start is a convention (can be turned off). The AI uses the same MCTS playouts, stopped at the capture target.":["Le départ en croix est une convention (désactivable). L’IA utilise les mêmes simulations MCTS, arrêtées à l’objectif de capture.","L’avvio a croce è una convenzione (si può disattivare). L’IA usa le stesse simulazioni MCTS, fermate all’obiettivo di cattura.","El inicio en cruz es una convención (se puede desactivar). La IA usa las mismas simulaciones MCTS, detenidas al alcanzar el objetivo de captura.","O início em cruz é uma convenção (pode desativar-se). A IA usa as mesmas simulações MCTS, paradas no objetivo de captura.","Der Kreuzstart ist eine Konvention (abschaltbar). Die KI nutzt dieselben MCTS-Simulationen, abgebrochen beim Schlagziel.","A kereszt kezdés megegyezés (kikapcsolható). Az MI ugyanazokat az MCTS-szimulációkat használja, a levételi célnál leállítva."],"NoGo (anti-capture)":["NoGo (anti-capture)","NoGo (anti-cattura)","NoGo (anticaptura)","NoGo (anticaptura)","NoGo (Anti-Schlagen)","NoGo (levétel-ellenes)"],"Captures and suicide are forbidden; whoever has no legal move loses.":["Les captures et le suicide sont interdits ; celui qui n’a plus de coup légal perd.","Catture e suicidio sono vietati; perde chi non ha mosse legali.","Las capturas y el suicidio están prohibidos; pierde quien no tenga jugada legal.","As capturas e o suicídio são proibidos; perde quem não tiver jogada legal.","Schlagen und Selbstmord sind verboten; wer keinen legalen Zug hat, verliert.","A levétel és az öngyilkosság tilos; aki nem tud szabályosan lépni, veszít."],"A combinatorial variant of Go popular in game-AI competitions.":["Une variante combinatoire du Go populaire dans les compétitions d’IA de jeux.","Una variante combinatoria del Go popolare nelle competizioni di IA per giochi.","Una variante combinatoria del Go popular en las competiciones de IA de juegos.","Uma variante combinatória do Go popular nas competições de IA de jogos.","Eine kombinatorische Go-Variante, beliebt bei Spiele-KI-Wettbewerben.","A Go kombinatorikus változata, népszerű a játék-MI versenyeken."],"Players alternately place stones. Any move that would capture enemy stones or leave one's own chain without liberties is illegal. A player with no legal move on their turn loses. There is no pass.":["Les joueurs posent des pierres à tour de rôle. Tout coup qui capturerait des pierres ennemies ou laisserait sa propre chaîne sans liberté est illégal. Un joueur sans coup légal à son tour perd. Il n’y a pas de passe.","I giocatori posano pietre a turno. Qualsiasi mossa che catturerebbe pietre nemiche o lascerebbe la propria catena senza libertà è illegale. Un giocatore senza mosse legali nel proprio turno perde. Non esiste il passo.","Los jugadores colocan piedras por turnos. Cualquier jugada que capturase piedras enemigas o dejase la propia cadena sin libertades es ilegal. El jugador sin jugadas legales en su turno pierde. No hay pase.","Os jogadores colocam pedras à vez. Qualquer jogada que capturasse pedras inimigas ou deixasse a própria cadeia sem liberdades é ilegal. Um jogador sem jogadas legais na sua vez perde. Não há passe.","Die Spielenden setzen abwechselnd Steine. Jeder Zug, der gegnerische Steine schlagen oder die eigene Kette ohne Freiheiten lassen würde, ist illegal. Wer am Zug keinen legalen Zug hat, verliert. Es gibt kein Passen.","A játékosok felváltva tesznek köveket. Minden lépés, amely ellenséges köveket venne le, vagy a saját láncot szabadság nélkül hagyná, szabálytalan. Az a játékos, akinek a sorában nincs szabályos lépése, veszít. Passz nincs."],"Simple, faithful rules. No ko rule is needed (no captures occur).":["Règles simples et fidèles. Aucune règle de ko n’est nécessaire (aucune capture n’a lieu).","Regole semplici e fedeli. Non serve alcuna regola del ko (non avvengono catture).","Reglas simples y fieles. No hace falta regla de ko (no se producen capturas).","Regras simples e fiéis. Não é preciso regra de ko (não ocorrem capturas).","Einfache, getreue Regeln. Eine Ko-Regel ist nicht nötig (es wird nie geschlagen).","Egyszerű, hű szabályok. Ko-szabályra nincs szükség (nem történik levétel)."],"Rengo (2 vs 2)":["Rengo (2 contre 2)","Rengo (2 contro 2)","Rengo (2 contra 2)","Rengo (2 contra 2)","Rengo (2 gegen 2)","Rengo (2 a 2 ellen)"],"Team Go":["Go par équipes","Go a squadre","Go por equipos","Go por equipas","Team-Go","Csapat-Go"],"Two teams of two: partners alternate moves for the same colour without consulting. AI can fill any seat.":["Deux équipes de deux : les partenaires jouent à tour de rôle la même couleur sans se consulter. L’IA peut occuper n’importe quelle place.","Due squadre da due: i compagni muovono alternandosi con lo stesso colore senza consultarsi. L’IA può occupare qualsiasi posto.","Dos equipos de dos: los compañeros alternan jugadas del mismo color sin consultarse. La IA puede ocupar cualquier asiento.","Duas equipas de dois: os parceiros alternam jogadas da mesma cor sem se consultarem. A IA pode ocupar qualquer lugar.","Zwei Teams zu je zwei: Die Partner ziehen abwechselnd für dieselbe Farbe, ohne sich zu beraten. Die KI kann jeden Platz besetzen.","Két kétfős csapat: a társak felváltva lépnek ugyanazzal a színnel, egyeztetés nélkül. Az MI bármelyik helyet betöltheti."],"Traditional social variant played at clubs and events.":["Variante sociale traditionnelle jouée dans les clubs et lors d’événements.","Variante sociale tradizionale giocata nei club e negli eventi.","Variante social tradicional que se juega en clubes y eventos.","Variante social tradicional jogada em clubes e eventos.","Traditionelle gesellige Variante, gespielt in Clubs und bei Veranstaltungen.","Hagyományos társasági változat, klubokban és rendezvényeken játsszák."],"Move order: Black-1, White-1, Black-2, White-2, then again. The score belongs to the team. Partners may not discuss the position during the game. The chosen ruleset applies (Chinese by default here).":["Ordre de jeu : Noir-1, Blanc-1, Noir-2, Blanc-2, puis on recommence. Le score appartient à l’équipe. Les partenaires ne peuvent pas discuter de la position pendant la partie. Le jeu de règles choisi s’applique (chinoises par défaut ici).","Ordine di gioco: Nero-1, Bianco-
